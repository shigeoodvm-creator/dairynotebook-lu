// ─── 個体識別番号ユーティリティ ─────────────────────
// 個体識別番号(10桁)の6〜9桁目 = 拡大4桁
const get拡4 = tag => { const d=tag.replace(/\D/g,''); return d.length>=9?d.slice(5,9):''; };

// 農場モードに応じた表示ID closure を生成
// idMode='custom': animal.localId || get拡4(tagId) || tagId.slice(-4)
// idMode='exp4'(default): get拡4(tagId)
function makeDispId(fid, animalsArr) {
  const farm = DB.getFarm(fid);
  if(farm?.idMode !== 'custom') return tagId => get拡4(tagId);
  const arr = animalsArr || DB.getAnimals(fid);
  const map = new Map(arr.map(a => [a.tagId, a]));
  return tagId => {
    const a = map.get(tagId);
    return a?.localId || get拡4(tagId) || (tagId||'').slice(-4);
  };
}
// 農場のIDラベル文字列（「拡大4桁」or「管理ID」）
function idModeLabel(fid){ return DB.getFarm(fid)?.idMode==='custom'?'管理ID':'拡大4桁'; }

const fmtTagId = tag => {
  const d = tag.replace(/\D/g,'');
  if(d.length===10) return `<span class="tag-pre">${d.slice(0,5)}</span><span class="tag-exp">${d.slice(5,9)}</span><span class="tag-cd">${d.slice(9)}</span>`;
  return h(tag);
};

// ─── Utils ────────────────────────────────────────
const $ = id => document.getElementById(id);
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today = () => new Date().toLocaleDateString('sv-SE');
const todayCompact = () => { const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = d => d ? d.replace(/-/g,'/') : '－';
const shiftMonths = (baseDateStr, monthsBack) => {
  const d=new Date(baseDateStr||today());
  if(Number.isNaN(d.getTime()))return '';
  d.setMonth(d.getMonth()-monthsBack);
  return d.toLocaleDateString('sv-SE');
};
const calcAge = (b,s) => b ? Math.max(0,Math.floor((new Date(s||today()) - new Date(b))/86400000)) : null;
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const scClass = n => ['sc0','sc1','sc2','sc3','sc4','sc5'][n]||'sc0';
const normalizeSwabPathogens = vals => {
  const arr=(vals||[]).map(v=>String(v||'').trim()).filter(Boolean);
  const uniq=[];
  for(const p of arr){ if(!uniq.includes(p)) uniq.push(p); if(uniq.length>=3) break; }
  return uniq;
};
const fmtSwabPathogens = vals => {
  const ps=normalizeSwabPathogens(vals);
  return ps.length?ps.join(' / '):'病原体未入力';
};
const treatBadge = s => {
  const t=s.treatType||(s.treated?'new':'');
  if(t==='ongoing') return '<span class="badge b-amber">治療中</span>';
  if(t==='new')     return '<span class="badge b-red">介入</span>';
  return '<span style="color:var(--text-4)">－</span>';
};

// 個体の初診日情報を取得（{date, ageAtScan, scanId} の形式で返す）
// - treatType==='new': スキャン日が初診日
// - treatType==='ongoing': 手入力の firstDiagDate が初診日（未入力ならスキャン日）
// - 旧データ (treated && !treatType): スキャン日が初診日
const getFirstDiagInfo = (fid, animalId) => {
  const candidates = DB.getScans(fid)
    .filter(s => s.animalId === animalId && (s.treatType === 'new' || s.treatType === 'ongoing' || (s.treated && !s.treatType)))
    .map(s => {
      const diagDate = (s.treatType === 'ongoing' && s.firstDiagDate) ? s.firstDiagDate : s.scanDate;
      return { date: diagDate, ageAtScan: s.ageAtScan, scanId: s.id, isManual: s.treatType === 'ongoing' };
    })
    .sort((a, b) => a.date.localeCompare(b.date));
  return candidates[0] || null;
};

// 個体の初診スキャンを取得（後方互換・スキャンオブジェクトを返す）
const getFirstTreatScan = (fid, animalId) => {
  return DB.getScans(fid)
    .filter(s => s.animalId === animalId && (s.treatType === 'new' || (s.treated && !s.treatType)))
    .sort((a, b) => a.scanDate.localeCompare(b.scanDate))[0] || null;
};

/** 肺エコー実スキャン（退出・在舎のみ・群入退は除外） */
const isRealScan = (s) => !!s && !!s.scanDate && !s.vacated && !s.presentOnly && !s.penVacated && !s.penEntered;

/** 個体の実スキャン件数。onOrBeforeDate でその日以前に限定。excludeId は編集時の自身除外 */
const countRealScans = (fid, animalId, { onOrBeforeDate, excludeId } = {}) =>
  DB.getScans(fid).filter(s =>
    s.animalId === animalId && isRealScan(s) &&
    s.id !== excludeId &&
    (!onOrBeforeDate || s.scanDate <= onOrBeforeDate)
  ).length;

/** 次回検診ラウンド（実スキャン累計 + 1） */
const nextExamRound = (fid, animalId, onOrBeforeDate, excludeId) =>
  countRealScans(fid, animalId, { onOrBeforeDate, excludeId }) + 1;

/** 記録時点の検診ラウンド（保存値ではなく実スキャン順で算出） */
const examRoundForScan = (fid, animalId, scan) => {
  if (!isRealScan(scan)) return null;
  const list = DB.getScans(fid)
    .filter(s => s.animalId === animalId && isRealScan(s))
    .sort((a, b) => a.scanDate.localeCompare(b.scanDate) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  const i = scan.id ? list.findIndex(s => s.id === scan.id) : -1;
  if (i >= 0) return i + 1;
  const cd = scan.scanDate;
  const ca = scan.createdAt || '';
  let n = 0;
  for (const s of list) {
    if (s.scanDate < cd || (s.scanDate === cd && String(s.createdAt || '') <= ca)) n++;
  }
  return n + 1;
};

/** 乳牛判定（雌 && ホルスタイン/ジャージー/ブラウンスイス/エアシャー） */
const isDairyCow=(animal)=>{
  const breeds=['ホルスタイン','ジャージー','ブラウンスイス','エアシャー'];
  return animal?.sex==='F'&&breeds.some(b=>(animal.breed||'').includes(b));
};

/** 品種のコンパクト表示（ホル / 黒毛 / F1 など） */
const breedMeta=(breed)=>{
  const b=(breed||'').trim();
  if(!b) return null;
  if(/ホル|Holstein/i.test(b)) return {key:'hol',short:'ホル'};
  if(/黒毛|和牛|Wagyu/i.test(b)) return {key:'wagyu',short:'黒毛'};
  if(/F\s*1|交雑|交雜/i.test(b)) return {key:'f1',short:'F1'};
  if(/ジャージー|Jersey/i.test(b)) return {key:'jer',short:'Jer'};
  const short=b.length>3?b.slice(0,3):b;
  return {key:'other',short};
};
const breedChip=(breed,opts={})=>{
  const m=breedMeta(breed);
  if(!m) return opts.empty||'';
  const xs=opts.compact?' breed-chip-xs':'';
  return `<span class="breed-chip${xs} breed-${m.key}" title="${h(breed)}">${m.short}</span>`;
};
/** スキャン等から個体の品種を解決 */
const breedOfAnimal=(animals,sOrId)=>{
  if(!animals||!sOrId) return '';
  if(typeof sOrId==='string'){
    const a=animals.find(x=>x.id===sOrId);
    return a?.breed||'';
  }
  const a=animals.find(x=>x.id===sOrId.animalId)||animals.find(x=>x.tagId===sOrId.tagId);
  return a?.breed||'';
};

// ─── IndexedDB helpers（ファイルハンドル永続化）─────────────────────
const _idbOpen = () => new Promise((res,rej)=>{
  const r = indexedDB.open('ls-storage-v1',1);
  r.onupgradeneeded = e => e.target.result.createObjectStore('kv');
  r.onsuccess = e => res(e.target.result);
  r.onerror = ()=>rej(r.error);
});
const _idbGet = async key => {
  try{const db=await _idbOpen();return await new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch{return undefined;}
};
const _idbSet = async (key,val) => {
  try{const db=await _idbOpen();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch{}
};

// ─── FileStore（File System Access API + IndexedDB ハンドル永続化）───────
const FileStore = {
  _handle: null,         // FileSystemFileHandle
  _needPermission: false,// 許可待ち状態フラグ
  _dirty: false,
  _timer: null,

  // ファイルステータス（トップバー常時表示 + データメニュー内）
  _setStatus(primary, perm=false, secondary=''){
    const elMenu = document.getElementById('file-status');
    const barPri = document.getElementById('file-bar-primary');
    const barSec = document.getElementById('file-bar-secondary');
    const wrap = document.getElementById('file-bar');
    const dot = document.getElementById('file-dot');
    const visible = !!(primary || perm);
    if(wrap) wrap.style.display = visible ? '' : 'none';
    if(elMenu) elMenu.style.display = visible ? '' : 'none';

    const tipParts = [perm ? ('🔒 '+primary) : primary, secondary].filter(Boolean);
    const tip = tipParts.join(' — ');

    if(perm){
      if(barPri){
        barPri.replaceChildren();
        const sp = document.createElement('span');
        sp.style.color = 'var(--amber)';
        sp.textContent = '🔒 '+primary;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-outline';
        btn.style.cssText = 'font-size:10px;padding:2px 8px;height:auto;vertical-align:middle;margin-left:4px';
        btn.textContent = '許可する';
        btn.onclick = () => FileStore.requestPermission();
        barPri.appendChild(sp);
        barPri.appendChild(btn);
      }
      if(barSec){
        barSec.textContent = '前回の保存先JSONへのアクセス許可が必要です。許可すると読み込みと自動保存が再開されます。';
        barSec.style.display = '';
      }
      if(elMenu){
        elMenu.replaceChildren();
        const sp = document.createElement('span');
        sp.style.color = 'var(--amber)';
        sp.textContent = '🔒 '+primary;
        elMenu.appendChild(sp);
        elMenu.appendChild(document.createElement('br'));
        const btn = document.createElement('button');
        btn.className = 'btn-outline';
        btn.style.cssText = 'font-size:11px;padding:2px 8px;height:auto;margin-top:4px';
        btn.textContent = '許可する';
        btn.onclick = () => FileStore.requestPermission();
        elMenu.appendChild(btn);
      }
    } else {
      if(barPri) barPri.textContent = primary;
      if(barSec){
        barSec.textContent = secondary || '';
        barSec.style.display = secondary ? '' : 'none';
      }
      if(elMenu){
        elMenu.replaceChildren();
        const d1 = document.createElement('div');
        d1.textContent = primary;
        elMenu.appendChild(d1);
        if(secondary){
          const d2 = document.createElement('div');
          d2.style.cssText = 'font-size:10px;margin-top:4px;color:var(--text-4);line-height:1.45';
          d2.textContent = secondary;
          elMenu.appendChild(d2);
        }
      }
    }
    if(dot){
      const p = String(primary||'');
      let cls = '';
      if(perm) cls = 'warn';
      else if(p.indexOf('⚠️') !== -1) cls = 'err';
      else if(p.indexOf('✅') !== -1) cls = 'ok';
      else if(p) cls = 'warn';
      dot.className = cls;
      dot.title = tip || 'ファイル未接続';
    }
  },

  // サポート確認
  _supported(){
    return typeof window.showOpenFilePicker === 'function';
  },

  // 全データをまとめてシリアライズ
  _serialize(){
    const farms = DB.getFarms();
    const data = {v:'fs1', date: new Date().toISOString(), farms,
      animals: Object.fromEntries(farms.map(f=>[f.id, DB.getAnimals(f.id)])),
      scans:   Object.fromEntries(farms.map(f=>[f.id, DB.getScans(f.id)]))
    };
    return JSON.stringify(data, null, 2);
  },

  // ファイルに書き込む（内部用）
  async _write(){
    if(!this._handle || this._needPermission) return;
    try{
      const json = this._serialize();
      const writable = await this._handle.createWritable();
      await writable.write(json);
      await writable.close();
      try{
        const meta = JSON.parse(json);
        const t = meta.date ? new Date(meta.date).getTime() : Date.now();
        localStorage.setItem(`${PFX}:lastLocalTouch`, String(t));
      }catch{ DB._touchLocal(); }
      const ts = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      this._setStatus(`✅ ${this._handle.name}（${ts}保存）`, false, '編集内容はこのJSONへ自動保存されています（入力の約0.3秒後）。タブを閉じる前にこの表示を確認してください。');
      this._dirty = false;
    }catch(e){
      this._setStatus(`⚠️ 保存失敗: ${e.message}`, false, 'ファイルへ書き込めませんでした。権限やドライブを確認するか、「名前を付けて保存」で別ファイルへ退避してください。');
    }
  },

  // データ変更時に呼び出す（300ms デバウンス）
  schedule(){
    if(!this._handle || this._needPermission) return;
    this._dirty = true;
    clearTimeout(this._timer);
    this._timer = setTimeout(()=>this._write(), 300);
  },

  // 直ちにディスクへ書き込み（タブ非表示時・未同期データの救済用）
  flush(){
    if(this._timer){clearTimeout(this._timer);this._timer=null;}
    return this._write();
  },

  // JSONファイルの date とブラウザ内の最終編集を比較（ファイルが古いときは上書き読み込みしない）
  _fileOlderThanLocal(fileIsoDate){
    const ft = fileIsoDate ? new Date(fileIsoDate).getTime() : 0;
    const lt = parseInt(localStorage.getItem(`${PFX}:lastLocalTouch`)||'0',10);
    return lt > ft + 800;
  },

  // ファイルからロードした直後に編集時刻をファイルに合わせる
  _syncLocalTouchToFile(d){
    const t = d && d.date ? new Date(d.date).getTime() : Date.now();
    try{localStorage.setItem(`${PFX}:lastLocalTouch`, String(t));}catch{}
  },

  // 既存ファイルを開いて内容をロード
  async openFile(){
    if(!this._supported()){
      toast('このブラウザは File System Access API に対応していません（Edge/Chrome を使用してください）','err',4000);
      return;
    }
    try{
      const [handle] = await window.showOpenFilePicker({
        types:[{description:'DairyNotebookLS データ',accept:{'application/json':['.json']}}],
        multiple: false
      });
      this._handle = handle;
      this._needPermission = false;
      const file = await handle.getFile();
      const text = await file.text();
      const d = JSON.parse(text);
      if(d.v === 'fs1'){
        if(Array.isArray(d.farms)){
          DB._bulkLoad(d.farms, d.animals||{}, d.scans||{});
          this._syncLocalTouchToFile(d);
          toast(`ファイルを開きました（${d.farms.length}農場）`,'ok');
        }
      } else if(d.farm && Array.isArray(d.scans)){
        App.importFarm(new File([text], handle.name, {type:'application/json'}));
      } else {
        throw new Error('対応していないファイル形式です');
      }
      await _idbSet('fileHandle', handle);
      this._setStatus(`📂 ${handle.name}`, false, 'このファイルに接続済み。あとからの編集は自動で上書き保存されます。');
      updateTopBar();
      Router.nav('/dashboard');
    }catch(e){
      if(e.name !== 'AbortError') toast('ファイルを開けませんでした: '+e.message,'err');
    }
  },

  // 名前を付けて保存（新規ファイル作成 or 上書き先指定）
  async saveAs(){
    if(!this._supported()){
      const blob = new Blob([this._serialize()],{type:'application/json'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = `LS_${todayCompact()}.json`; a.click();
      URL.revokeObjectURL(url);
      toast('ダウンロードしました（ブラウザが File System Access API 非対応）','ok');
      return;
    }
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: `LS_${todayCompact()}.json`,
        types:[{description:'DairyNotebookLS データ',accept:{'application/json':['.json']}}]
      });
      this._handle = handle;
      this._needPermission = false;
      await this._write();
      await _idbSet('fileHandle', handle);
      toast(`「${handle.name}」に保存しました`,'ok');
    }catch(e){
      if(e.name !== 'AbortError') toast('保存失敗: '+e.message,'err');
    }
  },

  // 起動時：IndexedDB からハンドルを復元
  async tryRestore(){
    if(!this._supported()) return;
    try{
      const h = await _idbGet('fileHandle');
      if(!h) return;
      const perm = await h.queryPermission({mode:'readwrite'});
      if(perm === 'granted'){
        this._handle = h;
        this._needPermission = false;
        // 初回のみ：既にブラウザに農場データがあるのに lastLocalTouch が無い場合は「今」を入れ、古いJSONで上書きされにくくする
        if(!localStorage.getItem(`${PFX}:lastLocalTouch`) && DB.getFarms().length>0){
          try{localStorage.setItem(`${PFX}:lastLocalTouch`, String(Date.now()));}catch{}
        }
        const file = await h.getFile();
        const text = await file.text();
        const d = JSON.parse(text);
        if(d.v === 'fs1' && Array.isArray(d.farms)){
          if(this._fileOlderThanLocal(d.date)){
            const ts = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
            this._setStatus(`✅ ${h.name}（${ts}）`, false, 'ブラウザ内のデータの方が新しいため、古いJSONの内容は読み込みませんでした。自動保存でファイルへ反映します。');
            toast('ブラウザに未同期の編集が残っていたため、JSONファイルより新しいデータをそのまま使います。タブを閉じる前にステータスが「保存」になるまでお待ちください。','warn',6500);
            await this.flush();
            updateTopBar();
            if(DB.activeId() && DB.getFarm(DB.activeId())) Router.nav('/dashboard');
            else renderHome();
            return;
          }
          DB._bulkLoad(d.farms, d.animals||{}, d.scans||{});
          this._syncLocalTouchToFile(d);
        }
        const ts = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
        this._setStatus(`✅ ${h.name}（${ts}読込）`, false, '前回のJSONから復元しました。編集は自動でこのファイルに保存されます。');
        updateTopBar();
        if(DB.activeId() && DB.getFarm(DB.activeId())) Router.nav('/dashboard');
        else renderHome();
      } else {
        // 許可待ち状態を保持（ユーザーがボタンをクリックして許可）
        this._handle = h;
        this._needPermission = true;
        const tmpFile = await h.getFile();
        this._setStatus(tmpFile.name, true);
      }
    }catch(e){ this._handle = null; }
  },

  // アクセス再許可（ユーザー操作）
  async requestPermission(){
    if(!this._handle) return;
    try{
      const perm = await this._handle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        this._needPermission = false;
        if(!localStorage.getItem(`${PFX}:lastLocalTouch`) && DB.getFarms().length>0){
          try{localStorage.setItem(`${PFX}:lastLocalTouch`, String(Date.now()));}catch{}
        }
        const file = await this._handle.getFile();
        const text = await file.text();
        const d = JSON.parse(text);
        if(d.v === 'fs1' && Array.isArray(d.farms)){
          if(this._fileOlderThanLocal(d.date)){
            const ts = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
            this._setStatus(`✅ ${this._handle.name}（${ts}）`, false, 'ブラウザ内のデータの方が新しいため、古いJSONは読み込みませんでした。自動保存で反映します。');
            toast('ブラウザ内のデータを優先しました。JSONへ同期しています。','warn',5000);
            await this.flush();
            updateTopBar();
            toast('ファイルに接続しました','ok');
            if(DB.activeId() && DB.getFarm(DB.activeId())) Router.nav('/dashboard');
            else renderHome();
            return;
          }
          DB._bulkLoad(d.farms, d.animals||{}, d.scans||{});
          this._syncLocalTouchToFile(d);
        }
        const ts = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
        this._setStatus(`✅ ${this._handle.name}（${ts}読込）`, false, '接続しました。編集は自動でこのJSONに保存されます。');
        updateTopBar();
        toast('ファイルに接続しました','ok');
        if(DB.activeId() && DB.getFarm(DB.activeId())) Router.nav('/dashboard');
        else renderHome();
      }
    }catch(e){}
  }
};

// ─── DB ───────────────────────────────────────────
const DB = {
  g(k){try{return JSON.parse(localStorage.getItem(`${PFX}:${k}`))||null}catch{return null}},
  s(k,v){localStorage.setItem(`${PFX}:${k}`,JSON.stringify(v))},
  // 編集時刻（起動時にファイルより新しいブラウザ内データを守るため）
  _touchLocal(){
    try{localStorage.setItem(`${PFX}:lastLocalTouch`,String(Date.now()));}catch{}
  },
  getFarms(){return this.g('farms')||[]},
  saveFarms(f){this.s('farms',f);this._touchLocal();FileStore.schedule();},
  getFarm(id){return this.getFarms().find(f=>f.id===id)||null},
  saveFarm(f){const a=this.getFarms();const i=a.findIndex(x=>x.id===f.id);i>=0?a[i]=f:a.push(f);this.saveFarms(a)},
  delFarm(id){this.saveFarms(this.getFarms().filter(f=>f.id!==id));['animals','scans'].forEach(k=>localStorage.removeItem(`${PFX}:${id}:${k}`));if(this.activeId()===id)this.s('active','')},
  activeId(){return this.g('active')||null},
  setActive(id){this.s('active',id)},
  getAnimals(fid){try{return JSON.parse(localStorage.getItem(`${PFX}:${fid}:animals`))||[]}catch{return[]}},
  saveAnimals(fid,a){localStorage.setItem(`${PFX}:${fid}:animals`,JSON.stringify(a));this._touchLocal();FileStore.schedule();},
  findByTag(fid,tag){return this.getAnimals(fid).find(a=>a.tagId===tag.trim())||null},
  upsertAnimal(fid,tag,extra={}){
    let a=this.getAnimals(fid);let x=a.find(i=>i.tagId===tag.trim());
    if(!x){x={id:genId(),tagId:tag.trim(),birthDate:'',sex:'',breed:'',createdAt:today(),...extra};a.push(x);}
    else Object.keys(extra).forEach(k=>{if(extra[k])x[k]=extra[k];});
    this.saveAnimals(fid,a);return x;
  },
  getScans(fid){try{return JSON.parse(localStorage.getItem(`${PFX}:${fid}:scans`))||[]}catch{return[]}},
  saveScans(fid,s){localStorage.setItem(`${PFX}:${fid}:scans`,JSON.stringify(s));this._touchLocal();FileStore.schedule();},
  addScan(fid,s){const a=this.getScans(fid);s.id=genId();s.createdAt=new Date().toISOString();a.push(s);this.saveScans(fid,a);return s},
  updateScan(fid,s){const a=this.getScans(fid);const i=a.findIndex(x=>x.id===s.id);if(i>=0){a[i]=s;this.saveScans(fid,a);}},
  delScan(fid,sid){this.saveScans(fid,this.getScans(fid).filter(s=>s.id!==sid))},
  byAnimal(fid,animalId){return this.getScans(fid).filter(s=>s.animalId===animalId).sort((a,b)=>a.scanDate.localeCompare(b.scanDate))},
  exportData(fid){
    const farm=this.getFarm(fid);if(!farm)return null;
    return JSON.stringify({v:2,date:new Date().toISOString(),farm,animals:this.getAnimals(fid),scans:this.getScans(fid)},null,2);
  },
  importData(json){
    const d=JSON.parse(json);if(!d.farm||!Array.isArray(d.scans))throw new Error('フォーマットエラー');
    const nid=genId();
    const farm={...d.farm,id:nid,name:(d.farm.name||'農場')+'（インポート）',updatedAt:today()};
    this.saveFarm(farm);this.saveAnimals(nid,d.animals||[]);
    this.saveScans(nid,(d.scans||[]).map(s=>({...s,farmId:nid})));return nid;
  },
  // FileStore から全農場を一括ロード（localStorage も更新）
  _bulkLoad(farms, animalsMap, scansMap){
    this.s('farms', farms);
    farms.forEach(f=>{
      localStorage.setItem(`${PFX}:${f.id}:animals`, JSON.stringify(animalsMap[f.id]||[]));
      localStorage.setItem(`${PFX}:${f.id}:scans`,   JSON.stringify(scansMap[f.id]||[]));
    });
    if(farms.length > 0 && !this.getFarm(this.activeId())){
      this.setActive(farms[0].id);
    }
  },
  // 起動時に前回キャッシュを消去し、必ずファイル指定から開始する
  clearStartupCache(){
    try{
      const keysToDelete = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(`${PFX}:`)) keysToDelete.push(k);
      }
      keysToDelete.forEach(k=>localStorage.removeItem(k));
    }catch{}
  }
};

// ─── Drug Frequency ───────────────────────────────
const DRUG_BASE=[
  'エンロフロキサシン','フロルフェニコール','ツラスロマイシン','ガミスロマイシン',
  'チルミコシン','オキシテトラサイクリン','セフチオフル','タルチスロマイシン',
  'マルボフロキサシン','ダノフロキサシン','アンピシリン','セフキノム',
  'アモキシシリン','タイロシン','ペニシリンG','ゲンタマイシン',
  'TMP/SMX','カナマイシン','ネオマイシン','コリスチン','スペクチノマイシン','ドキシサイクリン','チアンフェニコール'
];
const DrugFreq={
  _k:`${PFX}:drug_freq`,
  get(){try{return JSON.parse(localStorage.getItem(this._k))||{}}catch{return{}}},
  inc(drug){
    if(!drug)return;
    const m=this.get();m[drug]=(m[drug]||0)+1;
    localStorage.setItem(this._k,JSON.stringify(m));
  },
  sorted(){
    const m=this.get();
    const known=DRUG_BASE.slice().sort((a,b)=>(m[b]||0)-(m[a]||0)||(DRUG_BASE.indexOf(a)-DRUG_BASE.indexOf(b)));
    const unknown=Object.keys(m).filter(d=>!DRUG_BASE.includes(d)).sort((a,b)=>m[b]-m[a]);
    return [...unknown,...known];
  },
  datalistHtml(){return this.sorted().map(d=>`<option value="${d}">`).join('');}
};

// ─── Analysis ─────────────────────────────────────
const Calc = {
  prev(scans){const t=scans.length,p=scans.filter(s=>s.obScore>=2).length;return{t,p,r:t?+(p/t*100).toFixed(1):0}},
  byDate(fid, scans=null){
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const map={};src.filter(s=>!s.vacated&&!s.presentOnly).forEach(s=>{if(!map[s.scanDate])map[s.scanDate]={d:s.scanDate,t:0,p:0};map[s.scanDate].t++;if(s.obScore>=2)map[s.scanDate].p++;});
    return Object.values(map).sort((a,b)=>a.d.localeCompare(b.d)).map(x=>({...x,r:+(x.p/x.t*100).toFixed(1)}));
  },
  dist(fid, scans=null){const src=Array.isArray(scans)?scans:DB.getScans(fid);const d=[0,0,0,0,0,0];src.filter(s=>!s.vacated&&!s.presentOnly).forEach(s=>{if(s.obScore>=0&&s.obScore<=5)d[s.obScore]++;});return d;},
  treatRate(fid, scans=null){const src=Array.isArray(scans)?scans:DB.getScans(fid);const sc=src.filter(s=>!s.vacated&&!s.presentOnly);const t=sc.filter(s=>s.treated).length;return{t,tot:sc.length,r:sc.length?+(t/sc.length*100).toFixed(1):0}},
  bm(fid, scans=null){
    const farm=DB.getFarm(fid);const tgt=BM[farm?.protocol||'B'];
    const bd=this.byDate(fid,scans);const cur=bd.length?bd[bd.length-1].r:null;
    return{cur,tgt,status:cur===null?'none':cur<=tgt?'ok':cur<=tgt*1.5?'warn':'alert'};
  },
  trend(fid, scans=null){
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const map={};
    src.filter(s=>!s.vacated&&!s.presentOnly).forEach(s=>{
      if(!map[s.scanDate])map[s.scanDate]={d:s.scanDate,t:0,p:0,sv:0,sum:0};
      map[s.scanDate].t++;
      map[s.scanDate].sum+=(Number(s.obScore)||0);
      if(s.obScore>=2)map[s.scanDate].p++;
      if(s.obScore>=4)map[s.scanDate].sv++;
    });
    return Object.values(map).sort((a,b)=>a.d.localeCompare(b.d)).map(x=>({
      ...x,
      avg:+(x.sum/x.t).toFixed(2),
      r:+(x.p/x.t*100).toFixed(1),
      sr:+(x.sv/x.t*100).toFixed(1)
    }));
  },
  ageBins(fid,step=7, scans=null){
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const map={};
    src.filter(s=>!s.vacated&&!s.presentOnly&&Number.isFinite(Number(s.ageAtScan))).forEach(s=>{
      const age=Math.max(0,Number(s.ageAtScan));
      const st=Math.floor(age/step)*step;
      const key=String(st);
      if(!map[key])map[key]={start:st,end:st+step-1,label:`${st}-${st+step-1}日齢`,t:0,p:0,sv:0,sum:0,c01:0,c23:0,c45:0};
      map[key].t++;
      map[key].sum+=(Number(s.obScore)||0);
      if(s.obScore>=2)map[key].p++;
      if(s.obScore>=4)map[key].sv++;
      if(s.obScore<=1)map[key].c01++;else if(s.obScore<=3)map[key].c23++;else map[key].c45++;
    });
    return Object.values(map).sort((a,b)=>a.start-b.start).map(x=>({
      ...x,
      avg:+(x.sum/x.t).toFixed(2),
      r:+(x.p/x.t*100).toFixed(1),
      sr:+(x.sv/x.t*100).toFixed(1)
    }));
  },
  byMonth(fid, scans=null){
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const map={};
    src.filter(s=>!s.vacated&&!s.presentOnly&&s.scanDate).forEach(s=>{
      const m=Number((s.scanDate||'').slice(5,7));
      if(!Number.isFinite(m)||m<1||m>12)return;
      if(!map[m])map[m]={m,t:0,p:0,sv:0,sum:0};
      map[m].t++;
      map[m].sum+=(Number(s.obScore)||0);
      if(s.obScore>=2)map[m].p++;
      if(s.obScore>=4)map[m].sv++;
    });
    const out=[];
    for(let m=1;m<=12;m++){
      const x=map[m]||{m,t:0,p:0,sv:0,sum:0};
      out.push({
        ...x,
        avg:x.t?+(x.sum/x.t).toFixed(2):0,
        r:x.t?+(x.p/x.t*100).toFixed(1):0,
        sr:x.t?+(x.sv/x.t*100).toFixed(1):0
      });
    }
    return out;
  },
  hutchRisk(fid, scans=null, opt={}){
    const mode=opt.mode||'col';
    const segments=Math.max(1,Number(opt.segments)||4);
    const farm=DB.getFarm(fid)||{};
    const hutches=farm.hutches||[];
    const hm=Object.fromEntries(hutches.map(x=>[x.id,x]));
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const zoneMap={};
    if(mode==='zone4'){
      const byCol={};
      hutches.forEach(hh=>{
        const c=Number(hh.col);
        if(!Number.isFinite(c))return;
        if(!byCol[c])byCol[c]=[];
        byCol[c].push(hh);
      });
      Object.entries(byCol).forEach(([col,arr])=>{
        const sorted=arr.slice().sort((a,b)=>(Number(a.row)||0)-(Number(b.row)||0)||String(a.label||'').localeCompare(String(b.label||''),undefined,{numeric:true,sensitivity:'base'}));
        sorted.forEach((hh,idx)=>{
          const zone=Math.min(segments-1,Math.floor(idx*segments/Math.max(1,sorted.length)));
          zoneMap[hh.id]=zone;
        });
      });
    }
    const map={};
    src.filter(s=>!s.vacated&&!s.presentOnly).forEach(s=>{
      let key='free',label='未設定';
      if(s.hutchId&&hm[s.hutchId]){
        const hutch=hm[s.hutchId];
        const col=Number(hutch.col);
        if(mode==='zone4'&&Number.isFinite(col)){
          const zone=(zoneMap[hutch.id]??0)+1;
          key=`col:${col}:zone:${zone}`;
          label=`${HutchUtil.colLabel(farm,col)}-${zone}`;
        }else{
          key=Number.isFinite(col)?`col:${col}`:`hutch:${hutch.id}`;
          label=Number.isFinite(col)?HutchUtil.colLabel(farm,col):(hutch.label||s.hutchId);
        }
      }else if(s.hutchFree&&s.hutchFree.trim()){
        key='free';
        label='自由入力ハッチ';
      }
      const order=(()=>{
        if(key.startsWith('col:')&&key.includes(':zone:')){
          const m=key.match(/^col:(\d+):zone:(\d+)$/);
          if(m)return Number(m[1])*100+Number(m[2]);
        }
        if(key.startsWith('col:'))return Number(key.split(':')[1])*100;
        return 99999;
      })();
      if(!map[key])map[key]={key,label,t:0,p:0,sv:0,sum:0,order};
      map[key].t++;
      map[key].sum+=(Number(s.obScore)||0);
      if(s.obScore>=2)map[key].p++;
      if(s.obScore>=4)map[key].sv++;
    });
    return Object.values(map).sort((a,b)=>a.order-b.order||a.label.localeCompare(b.label)).map(x=>({
      ...x,
      avg:+(x.sum/x.t).toFixed(2),
      r:+(x.p/x.t*100).toFixed(1),
      sr:+(x.sv/x.t*100).toFixed(1)
    }));
  },
  weather(fid){
    const farm=DB.getFarm(fid)||{};
    const rows=Array.isArray(farm.weatherRows)?farm.weatherRows:[];
    return rows.filter(r=>r&&r.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  },
  weatherImpact(fid, scans=null){
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const sc=src.filter(s=>!s.vacated&&!s.presentOnly&&s.scanDate);
    const wr=this.weather(fid);
    if(!sc.length||!wr.length)return {bins:[],count:0};
    const map={};
    wr.forEach((r,i)=>{
      const prev=i>0?wr[i-1]:null;
      map[r.date]={
        tMean:Number(r.tMean),
        tMax:Number(r.tMax),
        tMin:Number(r.tMin),
        diff:Number.isFinite(Number(r.tMax))&&Number.isFinite(Number(r.tMin))?+(Number(r.tMax)-Number(r.tMin)).toFixed(2):null,
        delta:Number.isFinite(Number(r.tMean))&&prev&&Number.isFinite(Number(prev.tMean))?+(Number(r.tMean)-Number(prev.tMean)).toFixed(2):null
      };
    });
    const bins={low:{label:'日較差 <8℃',t:0,p:0},mid:{label:'日較差 8-12℃',t:0,p:0},high:{label:'日較差 >=12℃',t:0,p:0}};
    sc.forEach(s=>{
      const w=map[s.scanDate];
      if(!w||w.diff==null)return;
      const key=w.diff<8?'low':w.diff<12?'mid':'high';
      bins[key].t++;
      if(s.obScore>=2)bins[key].p++;
    });
    const out=Object.values(bins).filter(x=>x.t>0).map(x=>({...x,r:+(x.p/x.t*100).toFixed(1)}));
    return {bins:out,count:out.reduce((m,x)=>m+x.t,0)};
  },
  scanScoreBars(fid, scans=null){
    const src=Array.isArray(scans)?scans:DB.getScans(fid);
    const sc=src.filter(s=>!s.vacated&&!s.presentOnly&&s.scanDate&&s.obScore!=null);
    const map=new Map();
    sc.forEach(s=>{
      if(!map.has(s.scanDate))map.set(s.scanDate,[0,0,0,0,0,0]);
      const arr=map.get(s.scanDate);
      arr[Math.min(Math.max(Math.round(s.obScore),0),5)]++;
    });
    return [...map.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([date,counts])=>({date,counts}));
  },
  worsenRate(fid, scans=null){
    const allSrc=DB.getScans(fid).filter(s=>!s.vacated&&!s.presentOnly&&s.scanDate&&s.obScore!=null);
    const sc=Array.isArray(scans)?scans.filter(s=>!s.vacated&&!s.presentOnly&&s.scanDate&&s.obScore!=null):allSrc;
    const byAnimal=new Map();
    allSrc.forEach(s=>{
      if(!byAnimal.has(s.animalId))byAnimal.set(s.animalId,[]);
      byAnimal.get(s.animalId).push(s);
    });
    byAnimal.forEach(arr=>arr.sort((a,b)=>String(a.scanDate).localeCompare(String(b.scanDate))));
    const dateMap=new Map();
    sc.forEach(s=>{if(!dateMap.has(s.scanDate))dateMap.set(s.scanDate,{num:0,den:0});});
    sc.forEach(s=>{
      const arr=byAnimal.get(s.animalId)||[];
      const prev=arr.filter(p=>p.scanDate<s.scanDate).pop();
      if(!prev||prev.obScore>1)return;
      const d=dateMap.get(s.scanDate);if(!d)return;
      d.den++;if(s.obScore>=2)d.num++;
    });
    return [...dateMap.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([date,{num,den}])=>({date,rate:den>0?+(num/den*100).toFixed(1):null,numerator:num,denominator:den}));
  },
  suggest(r,l){
    const all=[...Object.values(r||{}),...Object.values(l||{})];
    // 肝変化・胸水・膿瘍 → スコア5
    if(all.includes('H')||all.includes('E')||all.includes('P'))return 5;
    // びまん性コンソリデーション（D）の葉数でスコア決定
    const diffuse=all.filter(x=>x==='D').length;
    if(diffuse>=3)return 5;
    if(diffuse===2)return 4;
    if(diffuse===1)return 3;
    // 局所コンソリデーション（C）が1ヶ所以上 → スコア2
    if(all.includes('C'))return 2;
    // 帯状Bライン（コメットライン）→ スコア1
    if(all.includes('B'))return 1;
    // 線状Bライン（L）はスコアに影響しない → 0
    return 0;
  }
};

// ─── HutchUtil ────────────────────────────────────
const HutchUtil = {
  get(fid){ return DB.getFarm(fid)?.hutches||[]; },

  // 指定日時点でのハッチ占有者を返す {scan, animal} or null
  occupant(fid, hutchId, asOf){
    const sc = DB.getScans(fid)
      .filter(s=>s.hutchId===hutchId && s.scanDate<=asOf)
      .sort((a,b)=>b.scanDate.localeCompare(a.scanDate)||b.createdAt.localeCompare(a.createdAt));
    if(!sc.length) return null;
    const scan=sc[0];
    if(scan.vacated) return null; // 退出済み → 空ハッチ
    const animal=DB.getAnimals(fid).find(a=>a.id===scan.animalId)||null;
    return {scan,animal};
  },

  // ハッチの入退記録を時系列で返す [{animalId,tagId,scans,from,to,lastScore,exitDate}]
  history(fid, hutchId){
    const scans=DB.getScans(fid).filter(s=>s.hutchId===hutchId)
      .sort((a,b)=>a.scanDate.localeCompare(b.scanDate));
    const groups=[];
    for(const s of scans){
      if(s.vacated){
        // 退出記録：現在グループの同一個体を閉じる
        const last=groups[groups.length-1];
        if(last&&last.animalId===s.animalId&&!last.exitDate) last.exitDate=s.scanDate;
      } else {
        const last=groups[groups.length-1];
        if(last&&last.animalId===s.animalId&&!last.exitDate){
          last.scans.push(s);last.to=s.scanDate;if(!s.presentOnly)last.lastScore=s.obScore;
        } else {
          groups.push({animalId:s.animalId,tagId:s.tagId,scans:[s],from:s.scanDate,to:s.scanDate,lastScore:s.presentOnly?null:s.obScore,exitDate:null});
        }
      }
    }
    return groups;
  },

  // 個体のハッチ移動履歴 [{hutchLabel, scanDate, obScore}]
  animalMoves(fid, animalId){
    const hutches=this.get(fid);
    return DB.getScans(fid).filter(s=>s.animalId===animalId && s.hutchId && !s.vacated && !s.presentOnly)
      .sort((a,b)=>a.scanDate.localeCompare(b.scanDate))
      .map(s=>({...s, hutchLabel: hutches.find(h=>h.id===s.hutchId)?.label||s.hutchId}));
  },

  /** 個体のスキャン履歴で、ハッチが記録されている直近1件（退出記録・空ハッチは除く） */
  lastHutchFromScans(fid, animalId){
    const scans=DB.getScans(fid).filter(s=>s.animalId===animalId&&(s.hutchId||s.hutchFree)&&!s.vacated)
      .sort((a,b)=>b.scanDate.localeCompare(a.scanDate)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    return scans[0]||null;
  },

  // ファームのスキャン日一覧（昇順・退出記録除く）
  scanDates(fid){ return [...new Set(DB.getScans(fid).filter(s=>!s.vacated).map(s=>s.scanDate))].sort(); },

  // 標準レイアウト生成
  genStandard(leftN, rightN, lbl0='左列', lbl1='右列'){
    const h=[];
    for(let i=0;i<leftN;i++) h.push({id:genId(),label:`${lbl0}-${i+1}`,col:0,row:i});
    for(let i=0;i<rightN;i++) h.push({id:genId(),label:`${lbl1}-${i+1}`,col:1,row:i});
    return h;
  },

  // レイアウトのグリッドサイズを返す {cols, rows}
  gridSize(hutches){
    if(!hutches.length) return {cols:0,rows:0};
    return {cols:Math.max(...hutches.map(h=>h.col))+1, rows:Math.max(...hutches.map(h=>h.row))+1};
  },

  // 列ごとのラベルを返す（farm.hutchColLabels または自動生成）
  colLabel(farm, col){
    if(farm.hutchColLabels && farm.hutchColLabels[col]) return farm.hutchColLabels[col];
    return col===0?'左列':col===1?'右列':`列${col+1}`;
  }
};

// ─── Pen/Group Util ───────────────────────────────
const PenUtil={
  get(fid){ return DB.getFarm(fid)?.pens||[]; },

  // 指定日時点で penId に在籍している [{animal,scan}] を返す
  occupants(fid,penId,asOf){
    const date=asOf||today();
    const animals=DB.getAnimals(fid);
    const result=[];
    for(const a of animals){
      const cp=this.currentPen(fid,a.id,date);
      if(cp&&cp.penId===penId) result.push({animal:a,scan:cp.scan});
    }
    return result;
  },

  // 個体の指定日時点での現在群 {penId,scan} or null
  currentPen(fid,animalId,asOf){
    const date=asOf||today();
    const penScans=DB.getScans(fid)
      .filter(s=>s.animalId===animalId&&s.penId&&s.scanDate<=date)
      .sort((a,b)=>a.scanDate.localeCompare(b.scanDate)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    if(!penScans.length) return null;
    const last=penScans[penScans.length-1];
    if(last.penVacated) return null;
    return {penId:last.penId,scan:last};
  },

  // 群の入退履歴 [{animalId,tagId,from,to,exitDate}]
  history(fid,penId){
    const scans=DB.getScans(fid)
      .filter(s=>s.penId===penId)
      .sort((a,b)=>a.scanDate.localeCompare(b.scanDate)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    const groups=[];
    for(const s of scans){
      if(s.penVacated){
        const last=groups[groups.length-1];
        if(last&&last.animalId===s.animalId&&!last.exitDate) last.exitDate=s.scanDate;
      } else {
        const last=groups[groups.length-1];
        if(last&&last.animalId===s.animalId&&!last.exitDate){
          last.to=s.scanDate;
        } else {
          groups.push({animalId:s.animalId,tagId:s.tagId,from:s.scanDate,to:s.scanDate,exitDate:null});
        }
      }
    }
    return groups;
  },

  // 個体の群移動履歴 [{penId,penName,from,to,exitDate}]
  animalPenMoves(fid,animalId){
    const pens=this.get(fid);
    const scans=DB.getScans(fid)
      .filter(s=>s.animalId===animalId&&s.penId)
      .sort((a,b)=>a.scanDate.localeCompare(b.scanDate)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    const groups=[];
    for(const s of scans){
      if(s.penVacated){
        const last=groups[groups.length-1];
        if(last&&last.penId===s.penId&&!last.exitDate) last.exitDate=s.scanDate;
      } else {
        const last=groups[groups.length-1];
        if(last&&last.penId===s.penId&&!last.exitDate){
          last.to=s.scanDate;
        } else {
          const pen=pens.find(p=>p.id===s.penId);
          groups.push({penId:s.penId,penName:pen?.name||s.penId,from:s.scanDate,to:s.scanDate,exitDate:null});
        }
      }
    }
    return groups;
  }
};

const resetPageScroll=()=>{
  window.scrollTo(0,0);
  const hm=document.querySelector('.hm-scroll-area');

  const modal=document.querySelector('#modal-bg .modal');

const Router={
  _r:{},on(p,fn){this._r[p]=fn;},
  nav(p){
    const next=p.startsWith('/')?p:'/'+p;
    const cur=location.hash.slice(1)||'/dashboard';
    if(cur===next){resetPageScroll();return;}
    location.hash=next;
  },
  resolve(){
    const h=location.hash.slice(1)||'/dashboard';
    for(const[p,fn] of Object.entries(this._r)){const m=this._m(p,h);if(m!==null){fn(m);this._hl(h);resetPageScroll();return;}}
    this._r['/dashboard']&&this._r['/dashboard']({});this._hl('/dashboard');resetPageScroll();
  },
  _m(pat,path){const pp=pat.split('/'),hp=path.split('/');if(pp.length!==hp.length)return null;const pm={};for(let i=0;i<pp.length;i++){if(pp[i][0]===':')pm[pp[i].slice(1)]=hp[i];else if(pp[i]!==hp[i])return null;}return pm;},
  _hl(path){document.querySelectorAll('[data-route]').forEach(el=>{el.classList.toggle('active',path===el.dataset.route||path.startsWith(el.dataset.route+'/'))} );},
  init(){window.addEventListener('hashchange',()=>this.resolve());this.resolve();}
};

let NS={prefill:true,date:today(),historyDate:'',historyAuto:true,examiner:'',showPrevLobes:true,sort:null,sortDir:0};
let RS={date:'',examiner:'',nextDate:'',comment:''};

/** 野帳：refDate 以前の記録で、refDate 時点のハッチ占有（退出で解除）。スキャン0件＝ハッチ未割当扱いでリスト外 */
function noteAnimalHutchAtDate(fid, animalId, refDate){
  const scans=DB.getScans(fid).filter(s=>s.animalId===animalId&&s.scanDate<=refDate)
    .sort((a,b)=>a.scanDate.localeCompare(b.scanDate)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  if(!scans.length) return {noScans:true,hutchId:'',hutchFree:''};
  let hid='', hfree='';
  for(const s of scans){
    if(s.vacated){
      if(s.hutchId){
        if(s.hutchId===hid) hid='';
      }else if(s.hutchFree&&s.hutchFree.trim()&&s.hutchFree.trim()===hfree){
        hfree='';
      }
      continue;
    }
    if(s.hutchId){ hid=s.hutchId; hfree=''; }
    else if(s.hutchFree&&s.hutchFree.trim()){ hfree=s.hutchFree.trim(); hid=''; }
  }
  return {noScans:false,hutchId:hid,hutchFree:hfree};
}

/** 野帳：refDate 時点の「場所」（ハッチ優先、なければ群）を返す */
function noteAnimalLocationAtDate(fid,animalId,refDate){
  const ht=noteAnimalHutchAtDate(fid,animalId,refDate);
  if(ht.hutchId||ht.hutchFree) return {...ht,penId:'',penName:''};
  const cp=PenUtil.currentPen(fid,animalId,refDate);
  if(cp){
    const pen=PenUtil.get(fid).find(p=>p.id===cp.penId);
    return {noScans:false,hutchId:'',hutchFree:'',penId:cp.penId,penName:pen?.name||''};
  }
  return {...ht,penId:'',penName:''};
}

/** 野帳：historyDate 当日の実スキャン（退出・在舎のみ・群入退除く）のうち最新1件 */
function noteScanOnHistoryDate(fid, animalId, historyDate){
  if(!historyDate) return null;
  const cand=DB.getScans(fid).filter(s=>s.animalId===animalId&&s.scanDate===historyDate&&isRealScan(s))
    .sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  return cand[0]||null;
}

/** 野帳：refDate より前で「集団スキャン日（同日2件以上）」の直近日（なければ空） */
function noteDefaultHistoryDate(fid, refDate){
  const rd=refDate||today();
  const valid=DB.getScans(fid).filter(s=>isRealScan(s));
  const cnt=valid.reduce((m,s)=>{m[s.scanDate]=(m[s.scanDate]||0)+1;return m;},{});
  const examDates=Object.keys(cnt).filter(d=>cnt[d]>=2).sort((a,b)=>b.localeCompare(a));
  return examDates.find(d=>d<rd)||'';
}

  const animals=DB.getAnimals(fid);
  const dispId=makeDispId(fid,animals);
  animals.sort((a,b)=>dispId(a.tagId).localeCompare(dispId(b.tagId)));
  const notesHutches=HutchUtil.get(fid);
  const ROW_COUNT=40;
  const lobeKeysR=['rf_a','rf_p','r_m','r_c'];
  const lobeKeysL=['lf_a','lf_p','l_c'];
  const chip=(v)=>{
    const vv=(v||'').trim();
    if(!vv) return `<span style="font-size:11px;color:var(--text-4)">－</span>`;
    return `<span class="finding-chip ${FCHIP[vv]||'fch-empty'}" title="${FLBL[vv]||'未入力'}">${vv}</span>`;
  };

  const refDate=NS.date;
  const rows=[];
  if(NS.prefill){
    const picked=[];
    animals.forEach(a=>{
      const loc=noteAnimalLocationAtDate(fid,a.id,refDate);
      const inLocation=!!(loc.hutchId||loc.hutchFree||loc.penId);
      if(!inLocation) return;
      const lastHutch=loc.hutchId?(notesHutches.find(hh=>hh.id===loc.hutchId)?.label||loc.hutchId):(loc.hutchFree||loc.penName||'');
      const hist=noteScanOnHistoryDate(fid,a.id,NS.historyDate);

const renderReport=()=>{
  const fid=DB.activeId();const farm=DB.getFarm(fid);
  if(!fid||!farm){renderHome();return;}
  const _rptAnimals=DB.getAnimals(fid);
  const dispId=makeDispId(fid,_rptAnimals);
  const allScans=DB.getScans(fid);
  const validExamScans=allScans.filter(s=>!s.vacated&&!s.presentOnly&&!!s.scanDate);
  const examDateCount=validExamScans.reduce((m,s)=>{m[s.scanDate]=(m[s.scanDate]||0)+1;return m;},{});
  const dates=Object.keys(examDateCount).filter(d=>examDateCount[d]>=2).sort((a,b)=>b.localeCompare(a));
  if(!RS.date||!dates.includes(RS.date)) RS.date=dates[0]||'';
  const scans=RS.date?validExamScans.filter(s=>s.scanDate===RS.date).sort((a,b)=>dispId(a.tagId).localeCompare(dispId(b.tagId))):[];
  const total=scans.length;
  const treated=scans.filter(s=>s.treated).length;
  const score2=scans.filter(s=>s.obScore>=2).length;
  const prev=total?Math.round(score2/total*100):0;
  const currentDateIdx=dates.indexOf(RS.date);
  const prevDate=(currentDateIdx>=0&&currentDateIdx<dates.length-1)?dates[currentDateIdx+1]:'';
  const prevScans=prevDate?validExamScans.filter(s=>s.scanDate===prevDate):[];
  const prevTotal=prevScans.length;
  const prevScore2=prevScans.filter(s=>s.obScore>=2).length;
  const prevTreated=prevScans.filter(s=>s.treated).length;
  const severe=scans.filter(s=>s.obScore>=4).length;
  const prevSevere=prevScans.filter(s=>s.obScore>=4).length;
  const prevRate=prevTotal?Math.round(prevScore2/prevTotal*100):0;
  const _matchToPrev=(s)=>prevScans.find(p=>p.animalId&&s.animalId&&p.animalId===s.animalId)||prevScans.find(p=>p.tagId&&s.tagId&&String(p.tagId)===String(s.tagId));
  const trendScans=prevDate?scans.filter(s=>!!_matchToPrev(s)):[];
  const trendPrevScans=trendScans.map(s=>_matchToPrev(s));
  const trendCount=trendScans.length;
  const trendNowScore2=trendScans.filter(s=>s.obScore>=2).length;
  const trendNowSevere=trendScans.filter(s=>s.obScore>=4).length;
  const trendNowRate=trendCount?Math.round(trendNowScore2/trendCount*100):0;
  const trendPrevScore2=trendPrevScans.filter(s=>s.obScore>=2).length;
  const trendPrevSevere=trendPrevScans.filter(s=>s.obScore>=4).length;
  const trendPrevRate=trendCount?Math.round(trendPrevScore2/trendCount*100):0;
  const rateDiff=trendNowRate-trendPrevRate;
  const severeDiff=trendNowSevere-trendPrevSevere;
  const trendStatus=rateDiff<=-3&&severeDiff<=0
    ?{key:'good',label:'改善'}
    :rateDiff>=3||severeDiff>0
      ?{key:'bad',label:'悪化'}
      :{key:'flat',label:'横ばい'};
  const diffTxt=(now,before,unit='頭')=>{
    const d=now-before;
    if(d===0) return `<span class="rpt-diff-flat">→ 変化なし</span>`;
    if(d>0) return `<span class="rpt-diff-up">↑ +${d}${unit}</span>`;
    return `<span class="rpt-diff-down">↓ ${d}${unit}</span>`;
  };
  const diffPt=(now,before)=>{
    const d=now-before;
    if(d===0) return `<span class="rpt-diff-flat">→ 0pt</span>`;
    if(d>0) return `<span class="rpt-diff-up">↑ +${d}pt</span>`;
    return `<span class="rpt-diff-down">↓ ${d}pt</span>`;
  };
  const JLBL=['正常','経過観察（帯状B）','要治療（局所C）','要治療（びまんC1葉）','重症（びまんC2葉）','最重症'];
  const JBG=['#d1fae5','#dbeafe','#fef3c7','#ffedd5','#fee2e2','#fecaca'];

  const mkBadge=(s)=>`<span class="rpt-score-badge" style="background:${JBG[s.obScore]};color:${SC[s.obScore]}">${JLBL[s.obScore]}</span>`;
  const treatCell=(s)=>{
    const t=s.treatType||(s.treated?'new':'');
    if(t==='ongoing')return`<span style="color:#b45309;font-weight:700">治療中</span>`;
    if(t==='new')return`<span style="color:#ef4444;font-weight:700">介入</span>`;
    return`<span style="color:#94a3b8;font-weight:700">－</span>`;
  };
  const repScoreTrendInfo=(s)=>{
    if(!prevDate) return {key:'noprev',prev:null,caution:false};
    const ps=prevScans.find(p=>p.animalId&&s.animalId&&p.animalId===s.animalId)
      ||prevScans.find(p=>p.tagId&&s.tagId&&String(p.tagId)===String(s.tagId));
    if(!ps||ps.obScore==null||ps.obScore==='') return {key:'na',prev:null,caution:false};
    const p=Number(ps.obScore);
    const c=s.obScore!=null?Number(s.obScore):NaN;
    if(!Number.isFinite(p)||!Number.isFinite(c)) return {key:'na',prev:null,caution:false};
    const d=c-p;
    if(d>0) return {key:'bad',prev:p,caution:true};
    if(d<0) return {key:'good',prev:p,caution:false};
    return {key:'flat',prev:p,caution:false};
  };
  const repScorePrevN=(p)=>`<span class="rpt-prev-n" aria-label="前回スコア${p}">${p}</span>`;
  const repScoreTrendHtml=(t)=>{
    if(t.key==='noprev') return `<span class="rpt-score-trend rpt-score-trend-na">先回なし</span>`;
    if(t.key==='na') return `<span class="rpt-score-trend rpt-score-trend-na" title="先回検診に同一個体の記録がありません">―</span>`;
    if(t.key==='flat') return `<span class="rpt-score-trend rpt-score-trend-flat" title="前回スコアも${t.prev}">→横ばい</span>`;
    if(t.key==='good') return `<span class="rpt-score-trend rpt-score-trend-good" title="前回スコア${t.prev}">▼改善${repScorePrevN(t.prev)}</span>`;
    return `<span class="rpt-score-trend rpt-score-trend-bad" title="前回スコア${t.prev}">▲悪化${repScorePrevN(t.prev)}</span>`;
  };
  const repScoreCell=(s,t)=>`<div class="rpt-score-cell"><span class="score-badge ${scClass(s.obScore)}" style="width:28px;height:28px;font-size:13px;line-height:1">${s.obScore}</span>${repScoreTrendHtml(t)}</div>`;

  setView(`

  <div class="page-hd no-print">
    <div class="page-title">検診レポート</div>

  </div>

    <div style="display:flex;align-items:center;gap:6px">
      <label style="font-size:13px;font-weight:600">検診日</label>
      <select style="font-size:13px;padding:5px 10px;border-radius:6px;border:1.5px solid var(--border-2);background:#fff" onchange="App.onRepDate(this.value)">
        ${dates.length?dates.map(d=>`<option value="${d}"${d===RS.date?' selected':''}>${fmtDate(d)}</option>`).join(''):'<option>検診日データなし</option>'}
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <label style="font-size:13px;font-weight:600">担当獣医師</label>
      <input class="form-input" style="width:150px;font-size:13px;padding:5px 10px" value="${h(RS.examiner)}" placeholder="氏名" oninput="App.onRepExaminer(this.value)">
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <label style="font-size:13px;font-weight:600">次回検診予定日</label>
      <input class="form-input" type="date" style="font-size:13px;padding:5px 10px" value="${h(RS.nextDate)}" oninput="App.onRepNextDate(this.value)">
    </div>
    <button class="btn-outline btn-comment-mode${commentModeActive?' active':''}" onclick="toggleCommentMode()" style="white-space:nowrap">✏ コメントモード${commentModeActive?' ON':''}</button>
    <button class="btn btn-primary" onclick="window.print()" style="margin-left:auto">🖨 印刷 / PDF保存</button>
  </div>

  ${!dates.length?`<div class="callout cl-blue"><div class="callout-i">💡</div><div>比較対象となる検診日データ（実スキャン2件以上の日）がありません。検診日の入力後にレポート比較が有効になります。</div></div>`:''}
  <div class="rpt-wrap">

    <!-- ヘッダー -->

const mkMiniDonut=(counts)=>{
  const total=counts.reduce((s,c)=>s+c,0);
  if(!total)return`<div style="font-size:11px;color:#94a3b8;padding:6px 0">データなし</div>`;
  const lbls=['正常','帯状B','局所C','C1葉','C2葉','重症'];
  const r=28,cx=36,cy=36,circ=2*Math.PI*r;
  let off=0;
  const segs=counts.map((cnt,i)=>{
    if(!cnt)return'';
    const dash=(cnt/total)*circ;
    const seg=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${SC[i]}" stroke-width="13" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=dash;return seg;
  }).join('');
  const leg=counts.map((cnt,i)=>cnt?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.8;white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${SC[i]};flex-shrink:0"></span>${i}: ${cnt}頭</div>`:'').join('');
  return`<div style="display:flex;align-items:center;gap:10px">
    <svg width="72" height="72" viewBox="0 0 72 72" style="flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="13"/>
      ${segs}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1e293b">${total}</text>
      <text x="${cx}" y="${cy+11}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#64748b">頭</text>
    </svg>
    <div>${leg}</div>
  </div>`;
};

const renderHatchMap=()=>{
  const fid=DB.activeId();const farm=DB.getFarm(fid);
  if(!fid||!farm){renderHome();return;}
  const hutches=HutchUtil.get(fid);

  if(!hutches.length){
    setView(`
    <div class="page-hd">
      <div class="page-title">🏠 ハッチマップ</div>
      <div class="page-sub">${h(farm.name)}</div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="empty">
          <div class="empty-icon">🏠</div>
          <h3>ハッチが設定されていません</h3>
          <p>農場のハッチ（子牛舎）の配置を登録すると、スコアのヒートマップと時系列追跡ができます。</p>
          <button class="btn-primary" style="margin-top:16px" onclick="App.openHutchSetup()">ハッチを設定する</button>
        </div>
      </div>
    </div>`);
    return;
  }

  // 農場デフォルト向きの初期化（農場切り替え時または初回表示時のみ）
  if(HM._initialized !== fid){
    HM.flipH=farm.defaultFlipH||false;
    HM.flipV=farm.defaultFlipV||false;
    HM._initialized=fid;
  }

  // 日付決定
  const dates=HutchUtil.scanDates(fid);
  if(!HM.date) HM.date=dates.length?dates[dates.length-1]:today();
  const viewDate=HM.date;
  const dateIdx=dates.indexOf(viewDate);

  // 列ごとにハッチをグループ化（フリップ対応）
  const {cols}=HutchUtil.gridSize(hutches);
  let byCols=[];
  for(let c=0;c<cols;c++){
    const col=hutches.filter(h=>h.col===c).sort((a,b)=>a.row-b.row);
    byCols.push(HM.flipV ? col.slice().reverse() : col);
  }
  if(HM.flipH) byCols=byCols.slice().reverse();

  // 各ハッチの占有状態を取得
  const occ={};
  hutches.forEach(ht=>{occ[ht.id]=HutchUtil.occupant(fid,ht.id,viewDate);});
  const _hmAnimals=DB.getAnimals(fid);
  const dispId=makeDispId(fid,_hmAnimals);

  // ハッチセルHTML生成
  const cellHtml=(ht)=>{
    const o=occ[ht.id];
    if(!o) return `<div class="hm-cell hm-cell-empty" onclick="App.focusHutch('${ht.id}',this)" data-hid="${ht.id}" ${HM.focusHutch===ht.id?'class="hm-cell hm-cell-empty hm-active"':''}>
      <div class="hm-cell-no">${h(ht.label)}</div>
      <div class="hm-cell-tag" style="font-size:11px;font-family:inherit;color:var(--text-4)">空ハッチ</div>
    </div>`;
    const sc=o.scan;const tag拡4=dispId(sc.tagId);
    const bd=o.animal?.birthDate;
    const infoLine=bd?`${fmtDate(bd)}・${calcAge(bd,viewDate)}日齢`:'生年月日 未登録';
    const otitisBadge=(o.animal?.otitisHistory?.length>0)?`<div><span class="hm-otitis-badge">⚠️中耳炎歴</span></div>`:'';
    const swabBadge=(o.animal?.swabHistory?.length>0)?`<div><span class="hm-swab-badge">🧪スワブ</span></div>`:'';
    if(sc.presentOnly){
      return `<div class="hm-cell hm-present${HM.focusHutch===ht.id?' hm-active':''}" onclick="App.focusHutch('${ht.id}',this)" ondblclick="App.openHutchAnimalModal('${ht.id}')" title="ダブルクリックで個体詳細（編集）を開く" data-hid="${ht.id}">
        <div class="hm-cell-no">${h(ht.label)}</div>
        <div class="hm-present-badge">在</div>
        <div class="hm-cell-tag">${tag拡4}${breedChip(o.animal?.breed,{compact:true})}</div>
        <div class="hm-cell-info">${infoLine}</div>
        <div class="hm-cell-info" style="font-size:9px;color:#94a3b8">スキャンなし</div>
        ${otitisBadge}
        ${swabBadge}
      </div>`;
    }
    return `<div class="hm-cell hm-s${sc.obScore}${HM.focusHutch===ht.id?' hm-active':''}" onclick="App.focusHutch('${ht.id}',this)" ondblclick="App.openHutchAnimalModal('${ht.id}')" title="ダブルクリックで個体詳細（編集）を開く" data-hid="${ht.id}">
      <div class="hm-cell-no">${h(ht.label)}</div>
      <div class="hm-cell-score">${sc.obScore}</div>
      <div class="hm-cell-tag">${tag拡4}${breedChip(o.animal?.breed,{compact:true})}</div>
      <div class="hm-cell-info">${infoLine}</div>
      ${otitisBadge}
      ${swabBadge}
    </div>`;
  };

  // 詳細パネル HTML
  const detailHtml=()=>{
    if(!HM.focusHutch) return '';
    const ht=hutches.find(h=>h.id===HM.focusHutch);if(!ht)return'';
    const hist=HutchUtil.history(fid,HM.focusHutch);
    const animals=DB.getAnimals(fid);
    const currentOcc=occ[HM.focusHutch];
    const tlItems=hist.map(g=>{
      const a=animals.find(x=>x.id===g.animalId);
      const name=a?dispId(a.tagId)||a.tagId:g.tagId;
      const isCurrent=g===hist[hist.length-1]&&!g.exitDate;
      const moves=HutchUtil.animalMoves(fid,g.animalId);
      const moveStr=moves.length>1?moves.map(m=>h(m.hutchLabel)).join(' → '):'';
      return `<div class="hm-tl-item">
        <div>
          <div class="hm-tl-date">${fmtDate(g.from)}${g.from!==g.to?` ～ ${fmtDate(g.to)}`:''}</div>
          <div style="font-size:10px;color:var(--text-4);margin-top:1px">${g.scans.filter(s=>!s.presentOnly).length}回スキャン${g.scans.filter(s=>s.presentOnly).length>0?`・${g.scans.filter(s=>s.presentOnly).length}回在舎記録`:''}</div>
          ${g.exitDate?`<div class="hm-exit-date">🚪 退出：${fmtDate(g.exitDate)}</div>`:''}
          ${moveStr?`<div style="font-size:10px;color:var(--blue);margin-top:2px">移動: ${moveStr}</div>`:''}
        </div>
        <div>
          <div class="hm-tl-tag">${h(name)}${breedChip(a?.breed,{compact:true})}</div>
        </div>
        <div style="text-align:right">
          ${g.lastScore!=null?`<span class="score-badge ${scClass(g.lastScore)}" style="font-size:13px;width:26px;height:26px">${g.lastScore}</span>`:`<span class="present-badge" style="font-size:11px">在</span>`}
          ${isCurrent?'<div style="font-size:10px;color:var(--teal);margin-top:2px">在舎中</div>':g.exitDate?`<div style="font-size:10px;color:var(--red);margin-top:2px">退出済</div>`:'<div style="font-size:10px;color:var(--text-4);margin-top:2px">退出済</div>'}
        </div>
      </div>`;
    }).join('');

    // ハッチのスコア推移（退出記録・在舎記録除く）
    const allScans=DB.getScans(fid).filter(s=>s.hutchId===HM.focusHutch&&!s.vacated&&!s.presentOnly).sort((a,b)=>a.scanDate.localeCompare(b.scanDate));
    const sparkDots=allScans.map(s=>`<div class="hm-tl-dot" style="background:${['#10b981','#3b82f6','#f59e0b','#f97316','#ef4444','#7f1d1d'][s.obScore]}" title="${fmtDate(s.scanDate)} スコア${s.obScore}"></div>`).join('');

    return `<div class="hm-detail">
      <div class="hm-detail-hd">
        🏠 ${h(ht.label)} の記録履歴
        ${currentOcc?`<button class="btn-sm btn-danger" style="margin-left:auto;font-size:11px" onclick="App.openExitModal('${HM.focusHutch}','${currentOcc.scan.animalId}','${currentOcc.scan.tagId}','${h(ht.label)}')">🚪 退出を記録</button>`:`<div style="margin-left:auto"></div>`}
        ${allScans.length?`<div style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-3)">推移: ${sparkDots}</div>`:''}
        <button class="btn-sm btn-ghost" style="margin-left:8px" onclick="App.focusHutch(null)">×</button>
      </div>
      ${hist.length===0
        ?`<div class="hm-no-data">このハッチにはまだスキャン記録がありません</div>`
        :`<div class="hm-timeline">${tlItems}</div>`}
    </div>`;
  };

  const scColors=['#10b981','#3b82f6','#f59e0b','#f97316','#ef4444','#7f1d1d'];
  // 各列の後に空白エリアを挿入（印刷時：ハッチごとのメモ書き用）
  const mapCols = byCols.reduce((acc,col,ci)=>{
    acc+=`<div class="hm-column hm-col-${ci===0?'left':'right'}">
      <div class="hm-col-header">${h(HutchUtil.colLabel(farm,ci))}</div>
      ${col.map(ht=>cellHtml(ht)).join('')}
    </div><div class="hm-print-blank"></div>`;
    return acc;
  },'');

  setView(`
  <div class="hm-print-scope hm-page-wrap">
  <!-- 画面上部（印刷では非表示） -->
  <div class="hm-screen-top" style="flex-shrink:0">
    <!-- コンパクトタイトル行 -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:16px;font-weight:800;color:var(--navy-2)">🏠 ハッチマップ</span>
      <span style="font-size:12px;color:var(--text-3)">${h(farm.name)}　ハッチ ${hutches.length}個</span>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn-sm btn-ghost hm-btn-print" onclick="App.hmPrint()" title="マップを印刷（A4縦・画面と同じレイアウト）">🖨 印刷</button>
        <button class="btn-sm btn-ghost hm-btn-print" onclick="App.hmPrint1Page()" title="全ハッチを1枚に収めて印刷（縮小）">🖨 1枚印刷</button>
        <button class="btn-sm btn-ghost" onclick="App.openHutchSetup()">⚙ ハッチを編集</button>
      </div>
    </div>

    <!-- コントロール（1行） -->
    <div class="hm-controls">
      <div class="hm-date-nav">
        <button onclick="App.hmPrevDate()" title="前の検診日" ${dateIdx<=0?'disabled':''}>◀</button>
        <input type="date" value="${viewDate}" onchange="App.hmSetDate(this.value)"
          style="border:1px solid var(--border-2);border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700;color:var(--navy-2)">
        <button onclick="App.hmNextDate()" title="次の検診日" ${dateIdx>=dates.length-1||!dates.length?'disabled':''}>▶</button>
      </div>
      ${dates.length?`<div style="font-size:11px;color:var(--text-4);white-space:nowrap">${dateIdx>=0?`${dateIdx+1}/${dates.length}回目`:'検診日前'}</div>`:''}
      <div style="display:flex;align-items:center;gap:4px;margin-left:4px">
        <button class="btn-sm ${HM.flipH?'btn-primary':'btn-ghost'}" onclick="App.hmFlip('H')" style="padding:2px 8px;font-size:11px" title="左右が現場と逆の場合に反転。青くなっている間は反転中。">⇄ 左右</button>
        <button class="btn-sm ${HM.flipV?'btn-primary':'btn-ghost'}" onclick="App.hmFlip('V')" style="padding:2px 8px;font-size:11px" title="前後（上下）が現場と逆の場合に反転。青くなっている間は反転中。">⇅ 前後</button>
        ${(HM.flipH||HM.flipV)?`<button class="btn-sm" onclick="App.hmFlipFix()" style="padding:2px 8px;font-size:11px;background:#b45309;color:#fff;border:none;border-radius:5px;font-weight:700" title="現在の反転表示をデータに永久保存。次回から自動で正しい向きで表示されます。">✔ 確定</button>`:''}
      </div>
      <div class="hm-legend">
        ${[0,1,2,3,4,5].map(n=>`<div class="hm-legend-item"><div class="hm-legend-dot" style="background:${scColors[n]}"></div>スコア${n}</div>`).join('')}
        <div class="hm-legend-item"><div class="hm-legend-dot" style="background:var(--border-2)"></div>空</div>
      </div>
    </div>
  </div>

  <!-- 印刷ヘッダー＋マップ（1枚印刷時はまとめて縮小） -->
  <div id="hm-1page-scale-root">
  <div id="hm-print-header">
    <div class="ph-title">ハッチマップ　${h(farm.name)}</div>
    <div class="ph-sub">検診日：${viewDate}　印刷：${today()}${HM.flipH||HM.flipV?`　[${HM.flipH?'左右反転':''}${HM.flipH&&HM.flipV?'・':''}${HM.flipV?'前後反転':''}]`:''}</div>
    <div class="ph-legend">
      ${[0,1,2,3,4,5].map(n=>`<div class="ph-legend-item"><div class="ph-legend-dot" style="background:${scColors[n]}"></div>スコア${n}</div>`).join('')}
      <div class="ph-legend-item"><div class="ph-legend-dot" style="background:#ccc"></div>空ハッチ</div>
    </div>
  </div>
  <div class="hm-scroll-area">
    <div class="hm-print-body">
      <div class="hm-outer">${mapCols}</div>
    </div>
    <div id="hm-detail-wrap">${detailHtml()}</div>
  </div>
  </div>
  </div>
  `);
  // ハッチマップページのみ全高レイアウト適用
  document.getElementById('main').style.cssText='margin-top:64px;height:calc(100vh - 64px);overflow:hidden';

let PM={date:null,_initialized:null};

const renderPenMap=()=>{
  const fid=DB.activeId();const farm=DB.getFarm(fid);
  if(!fid||!farm){renderHome();return;}
  // ハッチマップのレイアウトを解除
  document.getElementById('main').style.cssText='';
  $('view').style.cssText='';
  const pens=PenUtil.get(fid);
  const _pmAnimals=DB.getAnimals(fid);
  const dispId=makeDispId(fid,_pmAnimals);

  if(!pens.length){
    setView(`
    <div class="page-hd">
      <div class="page-title">🐄 群マップ</div>
      <div class="page-sub">${h(farm.name)}</div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="empty">
          <div class="empty-icon">🐄</div>
          <h3>群が設定されていません</h3>
          <p>ハッチ卒業後も継続して群（ペン）でスキャン管理を行う農場は、群を登録してください。</p>
          <button class="btn-primary" style="margin-top:16px" onclick="App.openPenSetup()">群を設定する</button>
        </div>
      </div>
    </div>`);
    return;
  }

  if(PM._initialized!==fid){PM._initialized=fid;PM.date=null;}
  if(!PM.date) PM.date=today();
  const viewDate=PM.date;

  const cards=pens.map(pen=>{
    const occs=PenUtil.occupants(fid,pen.id,viewDate);
    const badges=occs.map(({animal})=>{
      const lastScan=DB.getScans(fid)
        .filter(s=>s.animalId===animal.id&&!s.vacated&&!s.presentOnly&&!s.penVacated&&!s.penEntered&&s.scanDate<=viewDate&&s.obScore!=null)
        .sort((a,b)=>b.scanDate.localeCompare(a.scanDate)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0];
      const score=lastScan?.obScore;
      const bg=score!=null?SC[score]:'#94a3b8';
      return `<span class="pm-badge" style="background:${bg};color:#fff;border-color:${bg}"
        onclick="App.openAnimalModal('${animal.id}')" title="${h(fmtTagId(animal.tagId))}${score!=null?' スコア'+score:''}"
      >${h(dispId(animal.tagId))}<span class="pm-badge-x"
        onclick="event.stopPropagation();App.openPenExitModal('${pen.id}','${animal.id}','${animal.tagId}','${h(pen.name)}')" title="退群">✕</span></span>`;
    }).join('');
    return `<div class="pm-card">
      <div class="pm-card-name">${h(pen.name)}</div>
      <div class="pm-card-count">${occs.length}頭</div>
      <div class="pm-badges">${badges||'<span style="font-size:11px;color:var(--text-4)">在籍なし</span>'}</div>
      <button class="btn-sm btn-ghost" onclick="App.openPenEnterModal('${pen.id}','${h(pen.name)}')" style="font-size:11px">＋ 入群</button>
    </div>`;
  }).join('');

  setView(`
  <div class="page-hd">
    <div class="page-title">🐄 群マップ</div>
    <div class="page-sub">${h(farm.name)} ・ ${pens.length}群</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:6px">
      <label style="font-size:12px;color:var(--text-3)">基準日</label>
      <input type="date" class="form-input" style="width:150px;padding:4px 8px;font-size:12px"
        value="${viewDate}" onchange="PM.date=this.value;renderPenMap()">
    </div>
    <button class="btn-sm btn-ghost" onclick="App.openPenSetup()">⚙ 群を設定</button>
    <div class="hm-legend" style="margin-left:auto">
      ${[0,1,2,3,4,5].map(n=>`<div class="hm-legend-item"><div class="hm-legend-dot" style="background:${SC[n]}"></div>スコア${n}</div>`).join('')}
      <div class="hm-legend-item"><div class="hm-legend-dot" style="background:#94a3b8"></div>スキャン未</div>
    </div>
  </div>
  <div class="pm-grid">${cards}</div>
  `);
};

// HUTCH SETUP MODAL
const renderHutchSetupModal=(fid)=>{
  if(!fid) return;
  const farm=DB.getFarm(fid);if(!farm)return;
  const current=farm.hutches||[];
  const hasCustom=current.some(h=>h.col>1);
  const mode=farm.hutchMode||'standard';

  // 標準モード：プレビュー生成用
  const previewHtml=(leftN,rightN,lbl0,lbl1)=>{
    const lh=[]; const rh=[];
    for(let i=0;i<Math.min(leftN,8);i++) lh.push(`<div class="hutch-preview-cell">${lbl0}-${i+1}</div>`);
    for(let i=0;i<Math.min(rightN,8);i++) rh.push(`<div class="hutch-preview-cell">${lbl1}-${i+1}</div>`);
    return `<div class="hutch-preview-col"><div class="hutch-preview-col-hd">${lbl0}</div>${lh.join('')}${leftN>8?`<div style="font-size:10px;color:var(--text-4);text-align:center">...他${leftN-8}個</div>`:''}</div>
            <div class="hutch-preview-col"><div class="hutch-preview-col-hd">${lbl1}</div>${rh.join('')}${rightN>8?`<div style="font-size:10px;color:var(--text-4);text-align:center">...他${rightN-8}個</div>`:''}</div>`;
  };

  // カスタムモード：既存ハッチ一覧テーブル
  const customRows=current.map(ht=>`<tr>
    <td><input value="${h(ht.label)}" onchange="App._hcLabelChange('${ht.id}',this.value)" style="width:90px"></td>
    <td><input type="number" min="0" max="9" value="${ht.col}" onchange="App._hcColChange('${ht.id}',parseInt(this.value))" style="width:48px"></td>
    <td><input type="number" min="0" max="99" value="${ht.row}" onchange="App._hcRowChange('${ht.id}',parseInt(this.value))" style="width:48px"></td>
    <td><button class="btn-sm btn-danger" onclick="App._hcDel('${ht.id}')">削除</button></td>
  </tr>`).join('');

  const bg=$('modal-bg');bg.style.display='flex';
  bg.innerHTML=`<div class="modal" style="max-width:540px">
    <div class="modal-hd">
      <div class="modal-title">🏠 ハッチ設定 ─ ${h(farm.name)}</div>
      <button class="modal-x" onclick="App.closeModal()">×</button>
    </div>
    <div class="modal-body">

      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn-outline${mode==='standard'?' btn-primary':''}" onclick="App._hcMode('standard')" style="${mode==='standard'?'background:var(--navy);color:#fff;border-color:var(--navy)':''}">
          標準（左右列）
        </button>
        <button class="btn-outline${mode==='custom'?' btn-primary':''}" onclick="App._hcMode('custom')" style="${mode==='custom'?'background:var(--navy);color:#fff;border-color:var(--navy)':''}">
          カスタム（自由配置）
        </button>
      </div>

      <div id="hc-standard" style="display:${mode==='standard'?'block':'none'}">
        <div class="hutch-setup-grid">
          <div class="form-group"><label class="form-label">左列のラベル</label>
            <input class="form-input" id="hc-lbl0" value="${h(farm.hutchColLabels?.[0]||'左列')}" oninput="App._hcPreview()"></div>

/** ハッチ退出・移動（end / 別ハッチ / 群）を記録 */
const recordHutchExitOrMove=(fid,{animal,date,fromHutchId,fromHutchFree,destType,penDest,toHutchId,notes})=>{
  const hutches=HutchUtil.get(fid);
  const hutchLabel=id=>hutches.find(x=>x.id===id)?.label||id;
  const base={farmId:fid,animalId:animal.id,tagId:animal.tagId,scanDate:date,right:{},left:{},obScore:0,mainFindings:''};

  if(destType==='hutch'){
    if(!fromHutchId){return{ok:false,msg:'ハッチ間移動は、ハッチマップで設定したハッチ割り当てが必要です（自由入力のみの場合は退出後、スキャンで新ハッチを記録してください）'};}
    if(!toHutchId)return{ok:false,msg:'移動先のハッチを選択してください'};
    if(toHutchId===fromHutchId)return{ok:false,msg:'移動先は現在と別のハッチを選んでください'};
    const occ=HutchUtil.occupant(fid,toHutchId,date);
    if(occ?.animal?.id&&occ.animal.id!==animal.id){
      const animals=DB.getAnimals(fid);
      const disp=makeDispId(fid,animals);
      const otherTag=occ.animal.tagId||'';
      const otherName=occ.animal.localId||disp(otherTag)||otherTag;
      if(!confirm(`${fmtDate(date)} 時点で「${hutchLabel(toHutchId)}」には ${otherName} が在舎しています。\nこのまま移動を記録しますか？`))return{ok:false,cancelled:true};
    }
    const vac={...base,vacated:true,notes,relocatedToHutchId:toHutchId};
    vac.hutchId=fromHutchId;
    DB.addScan(fid,vac);
    const enter={...base,presentOnly:true,hutchId:toHutchId,notes:notes||''};
    DB.addScan(fid,enter);
    return{ok:true,msg:`${fmtDate(date)}　${hutchLabel(fromHutchId)} → ${hutchLabel(toHutchId)} に移動しました`};
  }

  const scan={...base,vacated:true,notes};
  if(fromHutchId)scan.hutchId=fromHutchId;else if(fromHutchFree)scan.hutchFree=fromHutchFree;
  if(destType==='pen'){
    if(!penDest)return{ok:false,msg:'移動先の群を選択してください'};
    scan.penId=penDest;scan.penEntered=true;
  }
  DB.addScan(fid,scan);
  const penName=penDest?PenUtil.get(fid).find(p=>p.id===penDest)?.name:'';
  return{ok:true,msg:`退出を記録しました（${fmtDate(date)}）${penName?' → '+penName+' へ入群':''}`};
};

const DEATH_AUTO_EXIT_TAG='[死亡自動]';

const removeAutoDeathExitScans=(fid,animalId)=>{
  const scans=DB.getScans(fid);
  const next=scans.filter(s=>!(s.animalId===animalId&&s.autoDeathExit));
  if(next.length<scans.length) DB.saveScans(fid,next);
};

const deathExitNote=(deathNotes)=>{
  const body=deathNotes?`死亡：${deathNotes}`:'死亡';
  return `${DEATH_AUTO_EXIT_TAG} ${body}`;
};

/** 死亡日時点のハッチ・群から自動退出記録を同期（既存の自動記録は置き換え） */
const syncDeathLocationExits=(fid,animal,deathDate,deathNotes)=>{
  removeAutoDeathExitScans(fid,animal.id);
  const notes=deathExitNote(deathNotes);
  const base={farmId:fid,animalId:animal.id,tagId:animal.tagId,scanDate:deathDate,right:{},left:{},obScore:0,mainFindings:'',autoDeathExit:true};
  const out={hutch:false,pen:false};

  const hutch=noteAnimalHutchAtDate(fid,animal.id,deathDate);
  if(!hutch.noScans&&(hutch.hutchId||hutch.hutchFree)){
    const scan={...base,vacated:true,notes};
    if(hutch.hutchId) scan.hutchId=hutch.hutchId;
    else scan.hutchFree=hutch.hutchFree;
    DB.addScan(fid,scan);
    out.hutch=true;
  }

  const pen=PenUtil.currentPen(fid,animal.id,deathDate);
  if(pen){
    DB.addScan(fid,{...base,penId:pen.penId,penVacated:true,notes});
    out.pen=true;
  }
  return out;
};

const ensureAnimalOtitisIds=(fid,animalId)=>{
  const animals=DB.getAnimals(fid);
  const a=animals.find(x=>x.id===animalId);
  if(!a?.otitisHistory?.length)return;
  let dirty=false;
  for(const r of a.otitisHistory){
    if(!r.id){r.id=genId();dirty=true;}
  }
  if(dirty) DB.saveAnimals(fid,animals);
};

const ensureAnimalSwabIds=(fid,animalId)=>{
  const animals=DB.getAnimals(fid);
  const a=animals.find(x=>x.id===animalId);
  if(!a?.swabHistory?.length)return;
  let dirty=false;
  for(const r of a.swabHistory){
    if(!r.id){r.id=genId();dirty=true;}
    const normalized=normalizeSwabPathogens(r.pathogens||[]);
    if((r.pathogens||[]).join('|')!==normalized.join('|')){r.pathogens=normalized;dirty=true;}
  }
  if(dirty) DB.saveAnimals(fid,animals);
};

const refreshAnimalMetaViews=(fid,animalId)=>{
  if(!fid||!animalId)return;
  const ttl=document.querySelector('#modal-bg .modal-title')?.textContent||'';

const addHutchPlacementScan=(fid,a,hutchNorm)=>{
  if(!(hutchNorm.hutchId||hutchNorm.hutchFree))return;
  const scanDate=today();
  const ageAtScan=a.birthDate?calcAge(a.birthDate,scanDate):null;
  const scan={
    farmId:fid,animalId:a.id,tagId:a.tagId,scanDate,ageAtScan,round:1,
    presentOnly:true,right:{},left:{},obScore:null,mainFindings:'',treated:false,treatType:'',drug:'',notes:''
  };
  if(hutchNorm.hutchId)scan.hutchId=hutchNorm.hutchId;else scan.hutchFree=hutchNorm.hutchFree;
  DB.addScan(fid,scan);
};
