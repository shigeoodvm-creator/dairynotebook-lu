// ─── Comment Mode（レポート赤ペンコメント） ──────────
let reportComments = {};
let commentFont = 'Yomogi';
let commentFontSize = '0.95rem';
let commentModeActive = false;
let commentEditorTarget = null;
const HIGHLIGHT_COLORS = ['#FFFF66','#66FF99','#FF99CC','#99CCFF','#FFCC66'];

function rgbToHex(rgb){if(!rgb)return null;var s=rgb.trim();if(/^#[0-9a-fA-F]{3,6}$/.test(s))return s.toUpperCase();var m=s.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/);if(!m)return null;return'#'+[m[1],m[2],m[3]].map(function(n){return('0'+parseInt(n,10).toString(16)).slice(-2).toUpperCase();}).join('');}

function escapeHtmlComment(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function sanitizeCommentHtml(html){
  var tmp=document.createElement('div');tmp.innerHTML=html;
  function processNode(node){
    if(node.nodeType===Node.TEXT_NODE)return node.cloneNode(false);
    if(node.nodeType!==Node.ELEMENT_NODE)return null;
    var tag=node.tagName.toUpperCase();
    if(tag==='BR')return document.createElement('br');
    if(tag==='SPAN'){
      var hex=rgbToHex(node.style.backgroundColor);
      if(hex&&HIGHLIGHT_COLORS.indexOf(hex)!==-1){var span=document.createElement('span');span.style.backgroundColor=hex;for(var i=0;i<node.childNodes.length;i++){var c=processNode(node.childNodes[i]);if(c)span.appendChild(c);}return span;}
      var frag=document.createDocumentFragment();for(var i=0;i<node.childNodes.length;i++){var c=processNode(node.childNodes[i]);if(c)frag.appendChild(c);}return frag;
    }
    var BLOCK=['DIV','P','LI','H1','H2','H3','H4','H5','H6','BLOCKQUOTE'];
    var frag=document.createDocumentFragment();for(var i=0;i<node.childNodes.length;i++){var c=processNode(node.childNodes[i]);if(c)frag.appendChild(c);}
    if(BLOCK.indexOf(tag)!==-1)frag.appendChild(document.createElement('br'));return frag;
  }
  var out=document.createElement('div');for(var i=0;i<tmp.childNodes.length;i++){var r=processNode(tmp.childNodes[i]);if(r)out.appendChild(r);}
  while(out.lastChild&&out.lastChild.nodeName==='BR')out.removeChild(out.lastChild);
  return out.innerHTML;
}

function loadCommentIntoEditor(divEl,stored){if(!stored){divEl.innerHTML='';return;}if(stored.indexOf('<')!==-1){divEl.innerHTML=sanitizeCommentHtml(stored);}else{divEl.innerHTML=escapeHtmlComment(stored).replace(/\n/g,'<br>');}}

function applyHighlight(color){
  var editorDiv=document.getElementById('commentEditorDiv');if(!editorDiv)return;
  editorDiv.focus();var sel=window.getSelection();
  if(editorDiv._savedRange){sel.removeAllRanges();sel.addRange(editorDiv._savedRange);editorDiv._savedRange=null;}
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return;
  var range=sel.getRangeAt(0);if(!editorDiv.contains(range.commonAncestorContainer))return;
  var span=document.createElement('span');span.style.backgroundColor=color;
  try{range.surroundContents(span);}catch(e){var fragment=range.extractContents();span.appendChild(fragment);range.insertNode(span);}
  sel.removeAllRanges();
}

function removeHighlight(){
  var editorDiv=document.getElementById('commentEditorDiv');if(!editorDiv)return;
  editorDiv.focus();var sel=window.getSelection();
  if(editorDiv._savedRange){sel.removeAllRanges();sel.addRange(editorDiv._savedRange);editorDiv._savedRange=null;}
  var spans=editorDiv.querySelectorAll('span[style*="background-color"]');
  var range=(sel&&sel.rangeCount>0)?sel.getRangeAt(0):null;
  spans.forEach(function(span){try{if(!range||range.isCollapsed||range.intersectsNode(span)){var parent=span.parentNode;if(!parent)return;while(span.firstChild)parent.insertBefore(span.firstChild,span);parent.removeChild(span);parent.normalize();}}catch(e){}});
}

const RPT_COMMENT_ZONES=[
  {after:'rpt-zone-overview',   zone:'overview',   label:'概要後'},
  {after:'rpt-zone-treated',    zone:'treated',    label:'要治療個体後'},
  {after:'rpt-zone-all',        zone:'all',        label:'全個体一覧後'}
];

function insertRptCommentZones(){
  var existing=document.querySelectorAll('.rpt-wrap .comment-zone');
  for(var i=0;i<existing.length;i++){if(existing[i].parentNode)existing[i].parentNode.removeChild(existing[i]);}
  RPT_COMMENT_ZONES.forEach(function(s){
    var anchorEl=document.getElementById(s.after);if(!anchorEl||!anchorEl.parentNode)return;
    var zone=document.createElement('div');zone.className='comment-zone';zone.setAttribute('data-zone',s.zone);
    anchorEl.parentNode.insertBefore(zone,anchorEl.nextSibling);
  });
  var mc=document.querySelector('.rpt-wrap');if(!mc)return;
  if(commentModeActive)mc.classList.add('comment-mode-active');else mc.classList.remove('comment-mode-active');
  renderRptCommentZones();
}

function renderRptCommentZones(){
  var zones=document.querySelectorAll('.rpt-wrap .comment-zone');
  zones.forEach(function(zone){
    var zoneId=zone.getAttribute('data-zone');var comment=reportComments[zoneId]||'';zone.innerHTML='';
    if(comment){
      zone.classList.add('has-comment');
      var textBlock=document.createElement('div');textBlock.className='comment-text-block';
      var textEl=document.createElement('p');textEl.className='comment-text';
      textEl.style.fontFamily="'"+commentFont+"', cursive";textEl.style.fontSize=commentFontSize;
      if(comment.indexOf('<')!==-1){textEl.innerHTML=sanitizeCommentHtml(comment);}else{textEl.innerHTML=escapeHtmlComment(comment).replace(/\n/g,'<br>');}
      textBlock.appendChild(textEl);
      var actions=document.createElement('div');actions.className='comment-actions';
      var editBtn=document.createElement('button');editBtn.type='button';editBtn.className='btn-comment-edit';editBtn.textContent='✏ 編集';
      (function(id){editBtn.addEventListener('click',function(){openCommentEditor(id);});})(zoneId);
      var delBtn=document.createElement('button');delBtn.type='button';delBtn.className='btn-comment-delete';delBtn.textContent='✕ 削除';
      (function(id){delBtn.addEventListener('click',function(){deleteComment(id);});})(zoneId);
      actions.appendChild(editBtn);actions.appendChild(delBtn);textBlock.appendChild(actions);zone.appendChild(textBlock);
    }else{
      zone.classList.remove('has-comment');
      var addBtn=document.createElement('button');addBtn.type='button';addBtn.className='comment-add-btn';addBtn.textContent='✏ ここにコメントを追加';
      (function(id){addBtn.addEventListener('click',function(){openCommentEditor(id);});})(zoneId);
      zone.appendChild(addBtn);
    }
  });
}

function toggleCommentMode(){
  commentModeActive=!commentModeActive;
  var mc=document.querySelector('.rpt-wrap');
  if(mc){if(commentModeActive)mc.classList.add('comment-mode-active');else mc.classList.remove('comment-mode-active');}
  var btn=document.querySelector('.btn-comment-mode');
  if(btn){if(commentModeActive){btn.classList.add('active');btn.textContent='✏ コメントモード ON';}else{btn.classList.remove('active');btn.textContent='✏ コメントモード';}}
}

function openCommentEditor(zoneId){
  commentEditorTarget=zoneId;
  var editorDiv=document.getElementById('commentEditorDiv');
  if(editorDiv){loadCommentIntoEditor(editorDiv,reportComments[zoneId]||'');editorDiv.style.fontFamily="'"+commentFont+"', cursive";editorDiv.style.fontSize=commentFontSize;editorDiv._savedRange=null;}
  var fontSel=document.getElementById('commentFontSelect');var sizeSel=document.getElementById('commentFontSizeSelect');
  if(fontSel)fontSel.value=commentFont;if(sizeSel)sizeSel.value=commentFontSize;
  var modal=document.getElementById('commentEditorModal');if(modal){modal.style.display='flex';}
  if(editorDiv)editorDiv.focus();
}

function closeCommentEditor(){
  commentEditorTarget=null;
  var modal=document.getElementById('commentEditorModal');if(modal)modal.style.display='none';
}

function saveCommentFromEditor(){
  if(!commentEditorTarget)return;
  var editorDiv=document.getElementById('commentEditorDiv');
  var html=editorDiv?sanitizeCommentHtml(editorDiv.innerHTML):'';
  var textOnly=editorDiv?editorDiv.textContent.trim():'';
  if(textOnly){reportComments[commentEditorTarget]=html;}else{delete reportComments[commentEditorTarget];}
  closeCommentEditor();renderRptCommentZones();
}

function deleteComment(zoneId){delete reportComments[zoneId];renderRptCommentZones();}

function onCommentFontChange(){
  var fontSel=document.getElementById('commentFontSelect');if(!fontSel)return;
  commentFont=fontSel.value;
  var editorDiv=document.getElementById('commentEditorDiv');if(editorDiv)editorDiv.style.fontFamily="'"+commentFont+"', cursive";
  document.querySelectorAll('.rpt-wrap .comment-text').forEach(function(t){t.style.fontFamily="'"+commentFont+"', cursive";});
}

function onCommentSizeChange(){
  var sizeSel=document.getElementById('commentFontSizeSelect');if(!sizeSel)return;
  commentFontSize=sizeSel.value;
  var editorDiv=document.getElementById('commentEditorDiv');if(editorDiv)editorDiv.style.fontSize=commentFontSize;
  document.querySelectorAll('.rpt-wrap .comment-text').forEach(function(t){t.style.fontSize=commentFontSize;});
}

  downloadCsvTemplate(){
    const bom='\uFEFF';
    const csv=bom+'耳標番号,生年月日,品種,性別\r\n1234567890,2024-03-15,ホルスタイン,F\r\n0987654321,2024-04-02,ホルスタイン,F\r\n';
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');

  importAnimalCsv(file){
    const doParse=txt=>{
      const fid=DB.activeId();if(!fid){toast('農場を選択してください','err');return;}
      const lines=txt.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(l=>l);
      let added=0,skipped=0,errors=0;
      const startIdx=/^\d{10}/.test(lines[0])?0:1;
      for(let i=startIdx;i<lines.length;i++){
        const cols=lines[i].split(',').map(s=>s.trim().replace(/^["']|["']$/g,''));
        const tagId=cols[0]?.replace(/\D/g,'')||'';
        if(tagId.length!==10){errors++;continue;}
        if(DB.findByTag(fid,tagId)){skipped++;continue;}
        const birthDate=cols[1]||'';const breed=cols[2]||'';const rawSex=(cols[3]||'').toUpperCase();
        const sex=rawSex==='F'||rawSex==='雌'?'F':rawSex==='M'||rawSex==='雄'?'M':'';
        DB.upsertAnimal(fid,tagId,{birthDate,breed,sex});added++;
      }
      toast(`${added}頭を登録しました（スキップ:${skipped}件、エラー:${errors}件）`,'ok');
      renderAnimals();
    };
    const r=new FileReader();
    r.onload=e=>{
      const txt=e.target.result;
      if(txt.includes('\uFFFD')){
        const r2=new FileReader();r2.onload=e2=>doParse(e2.target.result);r2.readAsText(file,'shift-jis');
      } else {
        doParse(txt);
      }
    };
    r.readAsText(file,'utf-8');
  },

  hmFlipFix(){
    if(!HM.flipH&&!HM.flipV) return;
    const fid=DB.activeId();const farm=DB.getFarm(fid);
    if(!farm||!farm.hutches?.length) return;
    const desc=(HM.flipH&&HM.flipV)?'左右・前後反転':HM.flipH?'左右反転':'前後反転';
    if(!confirm(`現在の表示向き（${desc}）をデータに確定します。\nハッチの配置情報が永続的に書き換えられます。続けますか？`)) return;
    const hutches=farm.hutches;
    const maxCol=Math.max(...hutches.map(h=>h.col));
    const maxRow=Math.max(...hutches.map(h=>h.row));
    const nextHutches=hutches.map(h=>({
      ...h,
      col:HM.flipH?maxCol-h.col:h.col,
      row:HM.flipV?maxRow-h.row:h.row,
    }));

    // 標準レイアウトは向き確定後に列/行の順でラベルを再採番して表示を一致させる
    if((farm.hutchMode||'standard')==='standard'){
      const colGroups={};
      nextHutches.forEach(ht=>{
        if(!colGroups[ht.col]) colGroups[ht.col]=[];
        colGroups[ht.col].push(ht);
      });
      Object.entries(colGroups).forEach(([col,list])=>{
        const colNum=Number(col);
        const base=HutchUtil.colLabel(farm,colNum);
        list
          .sort((a,b)=>a.row-b.row)
          .forEach((ht,idx)=>{ ht.label=`${base}-${idx+1}`; });
      });
    }
    farm.hutches=nextHutches;
    DB.saveFarm(farm);
    HM.flipH=false;HM.flipV=false;
    renderHatchMap();
  },

    const minLen=isCustomId?1:4;
    if(v.length<minLen){if(hint)hint.innerHTML='';return;}
    const allAnimals=DB.getAnimals(fid);
    const matched=isCustomId
      ? allAnimals.filter(a=>a.localId===v||(a.localId||'').toLowerCase()===v.toLowerCase())
      : allAnimals.filter(a=>get拡4(a.tagId)===v);
    const msg=$('tag-wrap-msg');

      const a=matched[0];
      const tagEl=$('f-tag');if(tagEl)tagEl.value=a.tagId;
      if(tagWrap)tagWrap.style.display='none';
      if(msg)msg.innerHTML='';

      if(hint)hint.innerHTML=`<span style="color:var(--teal);font-weight:600">✓ ${idDisp}　${breedChip(a.breed)||'<span style="opacity:.7">品種未設定</span>'}</span>`;

      if(msg)msg.innerHTML=`<div style="background:var(--amber-lt);border:1.5px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">⚠️</span><div><div style="font-weight:700;color:var(--amber);font-size:13px">${matched.length}頭がヒットしました</div><div style="font-size:12px;color:var(--text-2);margin-top:2px">個体識別番号（10桁）を入力して絞り込んでください</div></div></div>`;

  exportCSV(mode){
    // 対象農場を決定
    let targets=[];
    if(mode==='all'){
      targets=DB.getFarms();
      if(!targets.length){toast('データがありません','err');return;}
    } else {
      const fid=DB.activeId();if(!fid){toast('農場を選択してください','err');return;}
      const f=DB.getFarm(fid);if(!f)return;
      targets=[f];
    }

    // CSV ヘッダー（複数農場の場合、最初の農場のIDラベルを使用）
    const _csvHdrFid=targets[0]?.id||'';
    const _idColLbl=DB.getFarm(_csvHdrFid)?.idMode==='custom'?'管理ID':'拡大4桁';
    const HDR=[
      '農場名','耳標番号（10桁）',_idColLbl,'品種','性別','生年月日',
      '検査日','検査時日齢(日)','ハッチ','群',
      '右_前葉前部','右_前葉後部','右_中葉','右_後葉',
      '左_前葉前部','左_前葉後部','左_後葉',
      'OBスコア','主な所見','治療介入','薬剤','備考','ラウンド','記録作成日時',
      '売却日','売却体重(kg)','売却価格(円)','売却種別'
    ];

    // 所見コードを日本語ラベルに変換（研究データ用）
    const fLbl={'':'','A':'正常','L':'線状Bライン','B':'帯状Bライン(コメット)','C':'局所コンソリデーション','D':'びまん性コンソリデーション','H':'肝変化','E':'胸水','P':'膿瘍'};
    const sexLbl={'F':'雌','M':'雄','':'不明'};

    // CSV 値のエスケープ（カンマ・改行・ダブルクォート対応）
    const esc=v=>{
      if(v==null)return '';
      const s=String(v);
      if(s.includes(',')||s.includes('"')||s.includes('\n'))return '"'+s.replace(/"/g,'""')+'"';
      return s;
    };

    const rows=[HDR.map(esc).join(',')];

    for(const farm of targets){
      const _csvAnimals=DB.getAnimals(farm.id);
      const animalsMap=new Map(_csvAnimals.map(a=>[a.id,a]));
      const _csvDispId=makeDispId(farm.id,_csvAnimals);
      const hutches=HutchUtil.get(farm.id);
      const hutchLabel=s=>s.hutchId?(hutches.find(h=>h.id===s.hutchId)?.label||s.hutchId):s.hutchFree||'';
      const penLabel=s=>s.penId?(PenUtil.get(farm.id).find(p=>p.id===s.penId)?.name||s.penId):'';

      const scans=DB.getScans(farm.id).slice().sort((a,b)=>a.scanDate.localeCompare(b.scanDate));
      for(const s of scans){
        const an=animalsMap.get(s.animalId)||{};
        const row=[
          farm.name,
          s.tagId||'',
          _csvDispId(s.tagId||''),
          an.breed||'',
          sexLbl[an.sex||'']||'',
          an.birthDate||'',
          s.scanDate||'',
          s.ageAtScan!=null?s.ageAtScan:'',
          hutchLabel(s),
          penLabel(s),
          fLbl[s.right?.rf_a||''],
          fLbl[s.right?.rf_p||''],
          fLbl[s.right?.r_m ||''],
          fLbl[s.right?.r_c ||''],
          fLbl[s.left?.lf_a ||''],
          fLbl[s.left?.lf_p ||''],
          fLbl[s.left?.l_c  ||''],
          s.obScore!=null?s.obScore:'',
          s.mainFindings||'',
          s.treatType==='ongoing'?'治療中':s.treated?'治療介入':'なし',
          s.drug||'',
          s.notes||'',
          isRealScan(s)?(examRoundForScan(fid,s.animalId,s)||s.round||1):(s.round||''),
          s.createdAt||'',
          an.saleDate||'',
          an.saleWeightKg!=null?an.saleWeightKg:'',
          an.salePriceYen!=null?an.salePriceYen:'',
          an.saleType?({market:'市場出荷',direct:'直接販売',other:'その他'}[an.saleType]||an.saleType):'',
        ];
        rows.push(row.map(esc).join(','));
      }
    }

    // BOM付きUTF-8でExcelでも文字化けしないように出力
    const bom='\uFEFF';
    const csv=bom+rows.join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const fname=mode==='all'?`DairyNotebook_全農場_${today()}.csv`:`${targets[0].name}_${today()}.csv`;
    a.download=fname;
    a.click();
    URL.revokeObjectURL(url);
    const total=rows.length-1;
    toast(`CSVエクスポート完了（${total}件）`,'ok');
  },
  importWeatherCsv(){
    const fid=DB.activeId();if(!fid){toast('農場を選択してください','err');return;}
    const farm=DB.getFarm(fid);if(!farm){toast('農場が見つかりません','err');return;}
    const raw=($('weather-csv')?.value||'').trim();
    if(!raw){toast('CSVテキストを貼り付けてください','err');return;}
    const lines=raw.split(/\r?\n/).filter(x=>x.trim());
    if(lines.length<2){toast('CSV行数が不足しています','err');return;}
    const sample=lines.slice(0,10);
    const commaScore=sample.reduce((n,l)=>n+((l.match(/,/g)||[]).length),0);
    const tabScore=sample.reduce((n,l)=>n+((l.match(/\t/g)||[]).length),0);
    const delim=(tabScore>commaScore)?'\t':',';
    const splitLine=(line)=>{
      const out=[];let cur='';let q=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){
          if(q&&line[i+1]==='"'){cur+='"';i++;continue;}
          q=!q;continue;
        }
        if(ch===delim&&!q){out.push(cur.trim());cur='';continue;}
        cur+=ch;
      }
      out.push(cur.trim());
      return out;
    };
    const parsed=lines.map(splitLine);
    const norm=s=>String(s||'').toLowerCase().replace(/[“”"']/g,'').replace(/\s+/g,'').replace(/[()（）\[\]【】]/g,'');
    const findIdx=(row,keys)=>row.findIndex(c=>keys.some(k=>norm(c).includes(k)));
    const dateKeys=['date','日付','年月日','time'];
    const meanKeys=['tmean','mean','平均気温','日平均気温','temperature_2m_mean'];
    const maxKeys=['tmax','max','最高気温','日最高気温','temperature_2m_max'];
    const minKeys=['tmin','min','最低気温','日最低気温','temperature_2m_min'];
    let headerIdx=-1,iDate=-1,iMean=-1,iMax=-1,iMin=-1;
    for(let r=0;r<Math.min(parsed.length,12);r++){
      const row=parsed[r];
      const d=findIdx(row,dateKeys);
      const m=findIdx(row,meanKeys);
      const x=findIdx(row,maxKeys);
      const n=findIdx(row,minKeys);
      if(d>=0&&(m>=0||(x>=0&&n>=0))){
        headerIdx=r;iDate=d;iMean=m;iMax=x;iMin=n;break;
      }
    }
    if(headerIdx<0){toast('必要列（日付＋平均 or 最高/最低気温）が見つかりません（気象庁は「日別値」「気温」を選択）','err');return;}
    const toNum=v=>{
      const n=Number(String(v??'').replace(/[^\d.\-]/g,''));
      return Number.isFinite(n)?n:null;
    };
    const toDate=v=>{
      const s=String(v||'').trim();
      if(!s)return '';
      const m=s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
      if(!m)return '';
      return `${m[1]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[3])).padStart(2,'0')}`;
    };
    const map={};
    for(let i=headerIdx+1;i<parsed.length;i++){
      const cols=parsed[i];
      const date=toDate(cols[iDate]);
      if(!date)continue;
      const tMax=iMax>=0?toNum(cols[iMax]):null;
      const tMin=iMin>=0?toNum(cols[iMin]):null;
      let tMean=iMean>=0?toNum(cols[iMean]):null;
      if(tMean==null&&tMax!=null&&tMin!=null)tMean=+((tMax+tMin)/2).toFixed(2);
      if(tMean==null&&tMax==null&&tMin==null)continue;
      map[date]={date,tMean,tMax,tMin};
    }
    if(!Object.keys(map).length){toast('取り込める気象データがありませんでした','err');return;}
    const existing=Array.isArray(farm.weatherRows)?farm.weatherRows:[];
    const merged={};
    existing.forEach(r=>{if(r&&r.date)merged[r.date]=r;});
    Object.assign(merged,map);
    const rows=Object.values(merged).sort((a,b)=>a.date.localeCompare(b.date));
    DB.saveFarm({...farm,weatherRows:rows,updatedAt:today()});
    const newCount=Object.keys(map).length;
    toast(`気象CSVを取り込みました（新規・更新 ${newCount}日、合計 ${rows.length}日）`,'ok');
    renderAnalysis();
  },
  openWeatherCsvPicker(){
    $('weather-csv-file')?.click();
  },
  onWeatherCsvPicked(ev){
    const file=ev?.target?.files?.[0];
    if(file) this.loadWeatherCsvFile(file);
    if(ev?.target) ev.target.value='';
  },
  loadWeatherCsvFile(file){
    if(!file)return;
    const applyText=txt=>{
      const ta=$('weather-csv');
      if(!ta){toast('分析画面で実行してください','err');return;}
      ta.value=String(txt||'').trim();
      if(!ta.value){toast('CSVの内容を読み取れませんでした','err');return;}
      this.importWeatherCsv();
    };
    const r=new FileReader();
    r.onload=e=>{
      const txt=String(e.target?.result||'');
      if(txt.includes('\uFFFD')){
        const r2=new FileReader();
        r2.onload=e2=>applyText(e2.target?.result||'');
        r2.readAsText(file,'shift-jis');
      } else {
        applyText(txt);
      }
    };
    r.readAsText(file,'utf-8');
  },
  bindWeatherCsvDrop(){
    const zone=$('weather-dropzone');
    if(zone&&zone.dataset.bound!=='1'){
      const prevent=e=>{e.preventDefault();e.stopPropagation();};
      const onIn=e=>{prevent(e);zone.style.borderColor='var(--teal)';zone.style.background='rgba(16,185,129,.08)';};
      const onOut=e=>{prevent(e);zone.style.borderColor='var(--border-2)';zone.style.background='var(--surface-2)';};
      const onDrop=e=>{
        prevent(e);
        onOut(e);
        const file=e.dataTransfer?.files?.[0];
        if(!file){toast('CSVファイルが見つかりません','err');return;}
        this.loadWeatherCsvFile(file);
      };
      zone.addEventListener('dragenter',onIn);
      zone.addEventListener('dragover',onIn);
      zone.addEventListener('dragleave',onOut);
      zone.addEventListener('drop',onDrop);
      zone.dataset.bound='1';
    }
    const fi=$('weather-csv-file');
    if(fi&&fi.dataset.bound!=='1'){
      fi.addEventListener('change',ev=>this.onWeatherCsvPicked(ev));
      fi.dataset.bound='1';
    }
  },
  clearWeather(){
    const fid=DB.activeId();if(!fid)return;
    const farm=DB.getFarm(fid);if(!farm)return;
    if(!confirm('この農場の気象データを削除しますか？'))return;
    DB.saveFarm({...farm,weatherRows:[],updatedAt:today()});
    toast('気象データを削除しました','warn');
    renderAnalysis();
  },
  openMilkCsvImport(){
    const fid=DB.activeId();if(!fid){toast('農場を選択してください','err');return;}
    const bg=$('modal-bg');bg.style.display='flex';
    bg.innerHTML=`<div class="modal" style="max-width:620px">
      <div class="modal-hd">
        <div class="modal-title">🥛 乳検CSVインポート</div>
        <button class="modal-x" onclick="App.closeModal()">×</button>
      </div>
      <div class="modal-body" style="padding:20px 24px 24px">
        <p style="font-size:13px;color:var(--text-2);margin:0 0 14px;line-height:1.6">
          乳検（検定）CSVを取り込みます。<strong>個体識別番号（10桁）</strong>でこの農場の個体と照合し、一致した個体に産乳成績を追加します。
        </p>
        <div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text-2)">対応するCSV列（ヘッダー名で自動認識）</div>
        <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px">
          <thead><tr style="background:var(--surface)">
            <th style="padding:5px 8px;border:1px solid var(--border);text-align:left">フィールド</th>
            <th style="padding:5px 8px;border:1px solid var(--border);text-align:left">認識するヘッダー名（部分一致）</th>
            <th style="padding:5px 8px;border:1px solid var(--border);text-align:center">必須</th>
          </tr></thead>
          <tbody>
            ${[
              ['個体識別番号','識別番号 / 耳標 / 牛番号','●'],
              ['検定日','検定日 / 検査日','●'],
              ['産次','産次 / parity',''],
              ['泌乳日数','泌乳日数 / DIM',''],
              ['1日乳量(kg)','乳量 / 1日乳量 / 朝夕合計',''],
              ['乳脂率(%)','乳脂率 / 脂肪率',''],
              ['乳蛋白率(%)','蛋白率 / 蛋白質率',''],
              ['無脂固形分率(%)','無脂固形 / SNF',''],
              ['体細胞数(千/mL)','体細胞 / SCC',''],
            ].map(([f,k,req])=>`<tr><td style="padding:4px 8px;border:1px solid var(--border)">${f}</td><td style="padding:4px 8px;border:1px solid var(--border);color:var(--text-3)">${k}</td><td style="padding:4px 8px;border:1px solid var(--border);text-align:center;color:var(--red)">${req}</td></tr>`).join('')}
          </tbody>
        </table>
        <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">同一個体・同一検定日の既存データは上書きされます。</div>
        <input type="file" id="milk-csv-file" accept=".csv,text/csv" style="display:none">
        <div id="milk-dropzone" style="border:2px dashed var(--border-2);border-radius:8px;padding:24px;text-align:center;cursor:pointer;background:var(--surface-2);margin-bottom:12px" onclick="document.getElementById('milk-csv-file').click()">
          <div style="font-size:14px;color:var(--text-3);margin-bottom:4px">CSVファイルをドロップ または クリックして選択</div>
          <div style="font-size:11px;color:var(--text-4)">UTF-8・Shift-JIS どちらも対応</div>
        </div>
        <div id="milk-import-result"></div>
      </div>
    </div>`;
    const zone=document.getElementById('milk-dropzone');
    const fi=document.getElementById('milk-csv-file');
    const prevent=e=>{e.preventDefault();e.stopPropagation();};
    zone.addEventListener('dragenter',e=>{prevent(e);zone.style.borderColor='var(--teal)';zone.style.background='rgba(16,185,129,.08)';});
    zone.addEventListener('dragover',e=>{prevent(e);});
    zone.addEventListener('dragleave',e=>{prevent(e);zone.style.borderColor='var(--border-2)';zone.style.background='var(--surface-2)';});
    zone.addEventListener('drop',e=>{prevent(e);zone.style.borderColor='var(--border-2)';zone.style.background='var(--surface-2)';const f=e.dataTransfer?.files?.[0];if(f)this.loadMilkCsvFile(f);});
    fi.addEventListener('change',e=>{const f=e.target?.files?.[0];if(f)this.loadMilkCsvFile(f);fi.value='';});
  },
  loadMilkCsvFile(file){
    if(!file)return;
    const apply=txt=>this.importMilkCsv(txt);
    const r=new FileReader();
    r.onload=e=>{
      const txt=String(e.target?.result||'');
      if(txt.includes('�')){
        const r2=new FileReader();
        r2.onload=e2=>apply(String(e2.target?.result||''));
        r2.readAsText(file,'shift-jis');
      } else { apply(txt); }
    };
    r.readAsText(file,'utf-8');
  },
  importMilkCsv(raw){
    const fid=DB.activeId();if(!fid)return;
    const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
    if(lines.length<2){
      const el=document.getElementById('milk-import-result');
      if(el)el.innerHTML='<div style="color:var(--red);font-size:12px">データ行が見つかりません。</div>';
      return;
    }
    // 区切り文字自動判定
    const sample=lines.slice(0,5);
    const commaScore=sample.reduce((n,l)=>n+((l.match(/,/g)||[]).length),0);
    const tabScore=sample.reduce((n,l)=>n+((l.match(/\t/g)||[]).length),0);
    const delim=tabScore>commaScore?'\t':',';
    // ヘッダー行を探す（個体識別番号 または 検定日 を含む行）
    let hdrIdx=-1;
    for(let i=0;i<Math.min(5,lines.length);i++){
      const l=lines[i].toLowerCase();
      if(l.includes('識別')||l.includes('耳標')||l.includes('牛番号')||l.includes('検定日')||l.includes('検査日')){hdrIdx=i;break;}
    }
    if(hdrIdx<0){
      const el=document.getElementById('milk-import-result');
      if(el)el.innerHTML='<div style="color:var(--red);font-size:12px">ヘッダー行が見つかりません。「個体識別番号」「検定日」などの列名を含むCSVを使用してください。</div>';
      return;
    }
    const headers=lines[hdrIdx].split(delim).map(h=>h.replace(/^"|"$/g,'').trim());
    const ci=kws=>headers.findIndex(h=>kws.some(k=>h.includes(k)));
    const iTag=ci(['識別','耳標','牛番号','tagid','tag_id']);
    const iDate=ci(['検定日','検査日','testdate','test_date']);
    const iParity=ci(['産次','parity','泌乳産次']);
    const iDim=ci(['泌乳日数','dim']);
    const iMilk=ci(['乳量','1日乳量','朝夕合計','dailymilk','daily_milk']);
    const iFat=ci(['乳脂率','脂肪率','fat']);
    const iProtein=ci(['蛋白率','蛋白質率','protein']);
    const iSnf=ci(['無脂固形','snf']);
    const iScc=ci(['体細胞','scc']);
    if(iTag<0||iDate<0){
      const el=document.getElementById('milk-import-result');
      if(el)el.innerHTML='<div style="color:var(--red);font-size:12px">必須列（個体識別番号・検定日）が見つかりません。ヘッダー名を確認してください。</div>';
      return;
    }
    const animals=DB.getAnimals(fid);
    const toNum=v=>{if(v==null||v===''||v==='*'||v==='-')return null;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n;};
    const toInt=v=>{if(v==null||v===''||v==='*'||v==='-')return null;const n=parseInt(String(v).replace(/,/g,''),10);return isNaN(n)?null:n;};
    const parseDate=v=>{
      if(!v)return null;
      const s=String(v).trim().replace(/[年月]/g,'-').replace(/[日]/g,'').replace(/\//g,'-');
      if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){const [y,m,d]=s.split('-');return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;}
      return null;
    };
    let matched=0,added=0,updated=0,skipped=0;
    const matchedAnimals=new Set();
    for(let i=hdrIdx+1;i<lines.length;i++){
      const cols=lines[i].split(delim).map(c=>c.replace(/^"|"$/g,'').trim());
      const rawTag=(cols[iTag]||'').replace(/\D/g,'');
      if(rawTag.length!==10){skipped++;continue;}
      const testDate=parseDate(cols[iDate]);
      if(!testDate){skipped++;continue;}
      const animal=animals.find(a=>a.tagId===rawTag);
      if(!animal){skipped++;continue;}
      matched++;
      matchedAnimals.add(animal.id);
      if(!animal.milkRecords)animal.milkRecords=[];
      const existIdx=animal.milkRecords.findIndex(m=>m.testDate===testDate);
      const rec={
        id:existIdx>=0?animal.milkRecords[existIdx].id:genId(),
        testDate,
        parity:toInt(cols[iParity]),
        dim:toInt(cols[iDim]),
        dailyMilk:toNum(cols[iMilk]),
        fatPct:toNum(cols[iFat]),
        proteinPct:toNum(cols[iProtein]),
        snfPct:toNum(cols[iSnf]),
        scc:toNum(cols[iScc]),
        notes:'',
      };
      if(existIdx>=0){animal.milkRecords[existIdx]=rec;updated++;}
      else{animal.milkRecords.push(rec);added++;}
    }
    DB.saveAnimals(fid,animals);
    const el=document.getElementById('milk-import-result');
    if(el){
      const color=(added+updated>0)?'#15803d':'var(--red)';
      el.innerHTML=`<div style="font-size:12px;padding:10px 12px;background:#f0fdf4;border:1px solid #86efac;border-radius:7px;color:${color}">
        取り込み完了：<strong>${matchedAnimals.size}頭</strong>にマッチ / 新規 <strong>${added}件</strong> 追加 / 更新 <strong>${updated}件</strong>
        ${skipped>0?`<span style="color:#9ca3af;margin-left:8px">スキップ ${skipped}行（未登録個体・必須項目不足）</span>`:''}
      </div>`;
    }
    if(added+updated>0)toast(`乳検データを取り込みました（${added+updated}件）`,'ok');
  },
  importFarm(file){
    const r=new FileReader();
    r.onload=e=>{
      try{
        const text=e.target.result;
        const d=JSON.parse(text);
        if(!d.farm||!Array.isArray(d.scans)) throw new Error('フォーマットエラー');
        const baseName=d.farm.name||'農場';
        const farms=DB.getFarms();
        const existing=farms.find(f=>f.name===baseName);

        if(existing){
          const overwrite=confirm(`農場「${baseName}」はすでに存在します。\n\nOK：既存の記録をすべて置き換える\nキャンセル：別名としてインポートします`);
          if(overwrite){
            const fid=existing.id;
            const animals=d.animals||[];
            const scans=(d.scans||[]).map(s=>({...s,farmId:fid}));
            const farm={...existing,...d.farm,id:fid,name:existing.name,updatedAt:today()};
            DB.saveFarm(farm);DB.saveAnimals(fid,animals);DB.saveScans(fid,scans);
            DB.setActive(fid);updateTopBar();toast('インポートしました（上書き）','ok');Router.nav('/dashboard');return;
          }
        }

        let name=baseName;let n=1;
        while(DB.getFarms().some(f=>f.name===name)){n++;name=`${baseName}（${n}）`;}
        d.farm.name=name;
        const nid=DB.importData(JSON.stringify(d));
        DB.setActive(nid);updateTopBar();toast('インポートしました','ok');Router.nav('/dashboard');
      }catch(err){
        toast('インポート失敗：'+err.message,'err');
      }
    };
    r.readAsText(file);
  },
  init(){
    $('file-in').addEventListener('change',ev=>{if(ev.target.files[0])this.importFarm(ev.target.files[0]);ev.target.value='';});
    $('modal-bg').addEventListener('click',e=>{if(e.target===$('modal-bg'))this.closeModal();});
    // JSON接続時：タブ非表示・ページ離脱の直前に未フラッシュの保存を実行（閉じる直前の編集取りこぼし対策）
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden') FileStore.flush();
    });
    window.addEventListener('pagehide',()=>{ FileStore.flush(); });
    // ファイル未設定でデータがある場合、閉じる前に警告
    window.addEventListener('beforeunload', e=>{
      if((!FileStore._handle || FileStore._needPermission) && DB.getFarms().length > 0){
        e.preventDefault();
        e.returnValue = 'ファイルが保存されていません。「💾 名前を付けて保存」でOneDriveに保存してから閉じてください。';
      }
    });
    Router.on('/dashboard',()=>renderDashboard());
    Router.on('/scan/new',()=>renderNewScan());
    Router.on('/animals',()=>renderAnimals());
    Router.on('/history',()=>renderHistory());
    Router.on('/notes',()=>renderNotes());
    Router.on('/report',()=>renderReport());
    Router.on('/analysis',()=>renderAnalysis());
    Router.on('/guide',()=>renderGuide());
    Router.on('/exam-memo',()=>renderExamMemo());
    Router.on('/hatch-map',()=>renderHatchMap());
    Router.on('/pen-map',()=>renderPenMap());
    (async ()=>{
      DB.clearStartupCache();
      if(FileStore._supported()) await _idbSet('fileHandle', null);
      FileStore._handle = null;
      FileStore._needPermission = false;
      const sec = FileStore._supported()
        ? '起動時は前回キャッシュを復元しません。必ず「ファイルを開く」または「名前を付けて保存」でファイルを指定してから作業してください。'
        : 'このブラウザはフォルダ連携に非対応です。起動時は前回キャッシュを復元しません。「名前を付けて保存」でJSONをダウンロードして作業を開始してください。';
      FileStore._setStatus('📂 まずファイルを指定してください', false, sec);
      updateTopBar();
      Router.init();
      renderHome();
    })();
  }
};
App.init();
